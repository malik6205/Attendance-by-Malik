<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>B.Pharmacy | Dashboard</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --primary:#5b4bb7;
    --secondary:#9b6fd1;
    --green:#00b894;
    --red:#e74c3c;
    --orange:#f39c12;
    --blue:#3498db;
    --dark:#17142b;
    --white:#fff;
}

body{
    min-height:100vh;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    color:white;
    background:
        radial-gradient(circle at 10% 10%,#ffffff25,transparent 28%),
        radial-gradient(circle at 90% 90%,#ffffff18,transparent 30%),
        linear-gradient(135deg,#211b42,#5b4bb7,#9b6fd1);
    padding:14px;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
}

.topbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
}

.back{
    width:43px;
    height:43px;
    border:1px solid #ffffff35;
    border-radius:13px;
    background:#ffffff18;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.title{
    flex:1;
    text-align:center;
}

.title h1{
    font-size:20px;
}

.title p{
    font-size:11px;
    opacity:.7;
}

.logout{
    padding:9px 12px;
    border:0;
    border-radius:10px;
    background:#e74c3c;
    color:white;
    font-weight:700;
    cursor:pointer;
}

.card{
    background:#ffffff18;
    border:1px solid #ffffff30;
    backdrop-filter:blur(18px);
    border-radius:20px;
    padding:16px;
    margin-bottom:12px;
    box-shadow:0 18px 45px #0004;
}

.userbar{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
    font-size:12px;
}

.userbar strong{
    font-size:14px;
}

.spacer{
    flex:1;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
}

.stat{
    background:#ffffff16;
    border:1px solid #ffffff25;
    border-radius:14px;
    padding:14px 8px;
    text-align:center;
}

.stat b{
    display:block;
    font-size:23px;
}

.stat small{
    font-size:10px;
    opacity:.7;
}

.green{
    color:#69f0ae;
}

.red{
    color:#ff8a80;
}

.orange{
    color:#ffd54f;
}

.blue{
    color:#80d8ff;
}

.section-title{
    margin-bottom:12px;
    font-size:16px;
}

.subject-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.subject{
    background:#fff;
    color:#111827;
    border-radius:14px;
    padding:14px;
}

.subject-name{
    font-weight:800;
    font-size:13px;
}

.subject-info{
    font-size:11px;
    margin-top:5px;
    color:#555;
}

.progress{
    height:9px;
    background:#ddd;
    border-radius:20px;
    margin-top:10px;
    overflow:hidden;
}

.progress i{
    display:block;
    height:100%;
    background:linear-gradient(90deg,#5b4bb7,#9b6fd1);
    border-radius:20px;
}

.search{
    width:100%;
    padding:12px;
    border:0;
    border-radius:11px;
    outline:none;
    font-size:13px;
    margin-bottom:10px;
}

.student{
    background:#fff;
    color:#111827;
    padding:13px;
    border-radius:13px;
    margin-bottom:8px;
}

.student h3{
    font-size:14px;
}

.student p{
    font-size:11px;
    margin-top:3px;
}

.student-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-top:10px;
}

.mini{
    background:#eef4ff;
    padding:8px;
    border-radius:9px;
    text-align:center;
    font-size:10px;
}

.mini b{
    display:block;
    font-size:15px;
}

.admin-panel{
    display:none;
    border:1px solid #ffb74d66;
    background:#ff980018;
}

.admin-panel.show{
    display:block;
}

.admin-btn{
    padding:11px 13px;
    border:0;
    border-radius:10px;
    color:white;
    font-weight:750;
    cursor:pointer;
    margin:4px;
}

.reset{
    background:#e53935;
}

.refresh{
    background:#1976d2;
}

.message{
    text-align:center;
    font-size:12px;
    min-height:20px;
    margin-top:8px;
}

.loading{
    text-align:center;
    padding:20px;
    opacity:.7;
}

@media(max-width:700px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .subject-grid{
        grid-template-columns:1fr;
    }

    .student-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .logout{
        font-size:10px;
        padding:8px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- TOP -->

    <div class="topbar">

        <button
            class="back"
            onclick="goHome()">
            ←
        </button>

        <div class="title">
            <h1>📊 Dashboard</h1>
            <p>B.Pharmacy • 7th Semester</p>
        </div>

        <button
            class="logout"
            onclick="logout()">
            Logout
        </button>

    </div>


    <!-- USER -->

    <div class="card">

        <div class="userbar">

            <span>👤 Logged in as</span>

            <strong id="userName">
                —
            </strong>

            <span class="spacer"></span>

            <span id="userRole">
                Student
            </span>

        </div>


        <!-- OVERALL STATS -->

        <div class="stats">

            <div class="stat">
                <b
                    id="totalClasses"
                    class="blue">
                    0
                </b>
                <small>Total Records</small>
            </div>

            <div class="stat">
                <b
                    id="presentCount"
                    class="green">
                    0
                </b>
                <small>Present</small>
            </div>

            <div class="stat">
                <b
                    id="absentCount"
                    class="red">
                    0
                </b>
                <small>Absent</small>
            </div>

            <div class="stat">
                <b
                    id="attendancePercent"
                    class="orange">
                    0%
                </b>
                <small>Attendance</small>
            </div>

        </div>

    </div>


    <!-- SUBJECT -->

    <div class="card">

        <h2 class="section-title">
            📚 Subject-wise Attendance
        </h2>

        <div
            id="subjectList"
            class="subject-grid">

            <div class="loading">
                Loading...
            </div>

        </div>

    </div>


    <!-- STUDENTS -->

    <div class="card">

        <h2 class="section-title">
            👥 Student Attendance
        </h2>

        <input
            id="studentSearch"
            class="search"
            placeholder="Search name or enrollment..."
            oninput="renderStudents()">

        <div id="studentList">

            <div class="loading">
                Loading students...
            </div>

        </div>

    </div>


    <!-- ADMIN -->

    <div
        id="adminPanel"
        class="card admin-panel">

        <h2 class="section-title">
            🔐 Administrator Controls
        </h2>

        <p style="font-size:12px;opacity:.8;margin-bottom:10px;">
            These controls are available only to the administrator.
        </p>

        <button
            class="admin-btn refresh"
            onclick="loadDashboard()">
            🔄 Refresh Data
        </button>

        <button
            class="admin-btn reset"
            onclick="resetAllData()">
            ⚠️ Reset All Attendance
        </button>

        <div
            id="adminMessage"
            class="message">
        </div>

    </div>


</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycby2wlNgfHgpJjKhYpEx6sEPJsy5NhN2MwdAEF3h6v1l3RsOONTkL42wdGonfXWv9DogEg/exec";


/* =====================================================
   SESSION CHECK
   ===================================================== */

const loggedIn =
    sessionStorage.getItem("BP7_LOGGED_IN");

const session =
    sessionStorage.getItem("BP7_SESSION");

const userId =
    sessionStorage.getItem("BP7_USER_ID");

const userName =
    sessionStorage.getItem("BP7_USER_NAME");

const userRole =
    sessionStorage.getItem("BP7_ROLE");


if(
    loggedIn !== "true" ||
    !session
){

    window.location.replace("index.html");

}


/* =====================================================
   SHOW USER
   ===================================================== */

document.getElementById(
    "userName"
).textContent =
    userName || userId || "User";

document.getElementById(
    "userRole"
).textContent =
    userRole === "admin"
        ? "🔐 Administrator"
        : "🎓 Student";


/* =====================================================
   ADMIN PANEL
   ===================================================== */

if(
    String(userRole).toLowerCase() === "admin"
){

    document
        .getElementById("adminPanel")
        .classList.add("show");

}


/* =====================================================
   DATA
   ===================================================== */

let dashboardData = {

    records:[],

    students:[],

    subjects:{}

};


/* =====================================================
   LOAD DASHBOARD
   ===================================================== */

async function loadDashboard(){

    try{

        document.getElementById(
            "subjectList"
        ).innerHTML =
            '<div class="loading">Loading...</div>';

        const url =
            API_URL +
            "?action=dashboard" +
            "&session=" +
            encodeURIComponent(session) +
            "&userId=" +
            encodeURIComponent(userId);


        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Server error"
            );

        }


        const result =
            await response.json();


        console.log(
            "Dashboard:",
            result
        );


        if(
            result.success !== true
        ){

            if(
                result.message &&
                result.message
                    .toLowerCase()
                    .includes("login")
            ){

                logout();
                return;

            }

            throw new Error(
                result.message ||
                "Unable to load data"
            );

        }


        dashboardData =
            result.data || result;


        renderDashboard();

    }

    catch(error){

        console.error(error);

        document.getElementById(
            "subjectList"
        ).innerHTML =

            '<div class="loading">' +
            '❌ Unable to load attendance data.' +
            '</div>';

    }

}


/* =====================================================
   RENDER DASHBOARD
   ===================================================== */

function renderDashboard(){

    const records =
        dashboardData.records || [];

    const students =
        dashboardData.students || [];


    let present = 0;

    let absent = 0;


    records.forEach(
        record => {

            if(
                String(record.status)
                    .toLowerCase()
                    === "present"
            ){

                present++;

            }else{

                absent++;

            }

        }
    );


    const total =
        present + absent;


    const percentage =
        total
        ? (present / total) * 100
        : 0;


    document.getElementById(
        "totalClasses"
    ).textContent =
        records.length;


    document.getElementById(
        "presentCount"
    ).textContent =
        present;


    document.getElementById(
        "absentCount"
    ).textContent =
        absent;


    document.getElementById(
        "attendancePercent"
    ).textContent =
        percentage.toFixed(1) + "%";


    renderSubjects();

    renderStudents();

}


/* =====================================================
   SUBJECT-WISE
   ===================================================== */

function renderSubjects(){

    const box =
        document.getElementById(
            "subjectList"
        );


    const subjects =
        dashboardData.subjects || {};


    const names =
        Object.keys(subjects);


    if(!names.length){

        box.innerHTML =
            '<div class="loading">' +
            'No subject attendance available.' +
            '</div>';

        return;

    }


    box.innerHTML =
        names.map(
            subject => {

                const item =
                    subjects[subject] || {};


                const present =
                    Number(
                        item.present || 0
                    );


                const total =
                    Number(
                        item.total || 0
                    );


                const percent =
                    total
                    ? (present / total) * 100
                    : 0;


                return `

                    <div class="subject">

                        <div class="subject-name">
                            ${escapeHTML(subject)}
                        </div>

                        <div class="subject-info">

                            Present:
                            ${present}

                            /
                            ${total}

                            •
                            ${percent.toFixed(1)}%

                        </div>

                        <div class="progress">

                            <i
                                style="width:${Math.min(percent,100)}%">
                            </i>

                        </div>

                    </div>

                `;

            }
        ).join("");

}


/* =====================================================
   STUDENTS
   ===================================================== */

function renderStudents(){

    const box =
        document.getElementById(
            "studentList"
        );


    const search =
        document.getElementById(
            "studentSearch"
        )
        .value
        .toLowerCase()
        .trim();


    let students =
        dashboardData.students || [];


    students =
        students.filter(
            student => {

                const name =
                    String(
                        student.name || ""
                    ).toLowerCase();

                const enrollment =
                    String(
                        student.enrollment || ""
                    ).toLowerCase();


                return (
                    !search ||
                    name.includes(search) ||
                    enrollment.includes(search)
                );

            }
        );


    if(!students.length){

        box.innerHTML =
            '<div class="loading">' +
            'No students found.' +
            '</div>';

        return;

    }


    box.innerHTML =
        students
        .slice(0,100)
        .map(
            student => {

                const present =
                    Number(
                        student.present || 0
                    );


                const absent =
                    Number(
                        student.absent || 0
                    );


                const total =
                    present + absent;


                const percent =
                    total
                    ? (present / total) * 100
                    : 0;


                return `

                    <div class="student">

                        <h3>
                            ${escapeHTML(
                                student.name || "Unknown"
                            )}
                        </h3>

                        <p>
                            🎓
                            ${escapeHTML(
                                student.enrollment || ""
                            )}
                        </p>

                        <div class="student-grid">

                            <div class="mini">

                                <b class="green">
                                    ${present}
                                </b>

                                Present

                            </div>

                            <div class="mini">

                                <b class="red">
                                    ${absent}
                                </b>

                                Absent

                            </div>

                            <div class="mini">

                                <b class="orange">
                                    ${percent.toFixed(1)}%
                                </b>

                                Attendance

                            </div>

                        </div>

                    </div>

                `;

            }
        )
        .join("");

}


/* =====================================================
   ADMIN RESET
   ===================================================== */

async function resetAllData(){

    if(
        String(userRole).toLowerCase()
        !== "admin"
    ){

        alert(
            "Access denied. Administrator only."
        );

        return;

    }


    const confirmation =
        prompt(
            "This will permanently reset ALL attendance records.\n\n" +
            "Type RESET to continue:"
        );


    if(
        confirmation !== "RESET"
    ){

        return;

    }


    const adminMessage =
        document.getElementById(
            "adminMessage"
        );


    adminMessage.textContent =
        "Resetting attendance...";


    try{

        const url =
            API_URL +

            "?action=resetAllAttendance" +

            "&session=" +
            encodeURIComponent(session) +

            "&userId=" +
            encodeURIComponent(userId);


        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        const result =
            await response.json();


        if(
            result.success !== true
        ){

            throw new Error(
                result.message ||
                "Reset failed"
            );

        }


        adminMessage.textContent =
            "✅ All attendance records have been reset.";


        loadDashboard();

    }

    catch(error){

        console.error(error);

        adminMessage.textContent =
            "❌ " +
            (
                error.message ||
                "Reset failed"
            );

    }

}


/* =====================================================
   LOGOUT
   ===================================================== */

function logout(){

    sessionStorage.removeItem(
        "BP7_LOGGED_IN"
    );

    sessionStorage.removeItem(
        "BP7_SESSION"
    );

    sessionStorage.removeItem(
        "BP7_USER_ID"
    );

    sessionStorage.removeItem(
        "BP7_USER_NAME"
    );

    sessionStorage.removeItem(
        "BP7_ROLE"
    );


    window.location.replace(
        "index.html"
    );

}


/* =====================================================
   HOME
   ===================================================== */

function goHome(){

    window.location.href =
        "dashboard.html";

}


/* =====================================================
   HTML SECURITY
   ===================================================== */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================================
   START
   ===================================================== */

loadDashboard();

</script>

</body>
</html>
