<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>B.Pharmacy Attendance | Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#5b4bb7;--secondary:#9b6fd1;--green:#00b894;
  --red:#e74c3c;--blue:#3498db;--orange:#f39c12;
}
body{
  min-height:100vh;padding:18px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  color:#fff;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 10% 10%,#ffffff25,transparent 28%),
    radial-gradient(circle at 90% 90%,#ffffff18,transparent 30%),
    linear-gradient(135deg,#211b42,#5b4bb7,#9b6fd1);
}
.login-card{
  width:min(440px,100%);padding:32px;border-radius:26px;
  background:#ffffff18;border:1px solid #ffffff35;backdrop-filter:blur(20px);
  box-shadow:0 25px 70px #0005;text-align:center;
}
.logo{
  width:86px;height:86px;border-radius:22px;object-fit:cover;
  margin-bottom:16px;border:2px solid #ffffff50;background:#fff;
}
h1{font-size:28px;margin-bottom:7px}
.subtitle{opacity:.82;font-size:13px;line-height:1.5;margin-bottom:22px}
.role-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:18px}
.role-tab{
  border:1px solid #ffffff30;background:#ffffff0d;color:#fff;border-radius:12px;
  padding:10px 5px;font-weight:750;cursor:pointer;font-size:12px;
}
.role-tab.active{background:#fff;color:#4a3a9e}
.field{text-align:left;margin-bottom:13px}
label{display:block;font-size:12px;font-weight:750;margin:0 0 6px 4px}
input{
  width:100%;height:52px;border:0;outline:none;border-radius:13px;
  padding:0 15px;font-size:15px;background:#fff;color:#111827;
}
button.login{
  width:100%;height:54px;border:0;border-radius:14px;
  background:linear-gradient(135deg,#00bfa5,#00ced1);color:#fff;
  font-size:16px;font-weight:800;cursor:pointer;margin-top:5px;
}
button:disabled{opacity:.6;cursor:not-allowed}
.register{
  display:block;margin-top:13px;padding:13px;border:1px solid #ffffff30;
  border-radius:13px;color:#fff;text-decoration:none;font-weight:700;font-size:13px;
  background:#ffffff0d;
}
.register:hover{background:#ffffff18}
.info{
  margin-top:15px;padding:13px;border-radius:13px;background:#ffffff0b;
  font-size:11px;line-height:1.6;text-align:left;color:#eee;
}
#apiStatus,#message{margin-top:12px;font-size:12px;font-weight:700;line-height:1.5}
.success{color:#7dffb2}.error{color:#ffb5b5}.loading{display:none;margin-top:9px;font-size:12px}
.hidden{display:none}
@media(max-width:500px){.login-card{padding:25px 18px}h1{font-size:24px}}
</style>
</head>
<body>

<div class="login-card">

  <img src="pic/1.jpg" class="logo" alt="B.Pharmacy"
       onerror="this.style.display='none'">

  <h1>🔐 Welcome Back</h1>
  <div class="subtitle">
    B.Pharmacy Attendance Management System
  </div>

  <div class="role-tabs">
    <button class="role-tab active" id="studentTab" onclick="selectRole('student')">🎓 Student</button>
    <button class="role-tab" id="editorTab" onclick="selectRole('editor')">👨‍🏫 Editor</button>
    <button class="role-tab" id="adminTab" onclick="selectRole('admin')">🔐 Admin</button>
  </div>

  <div class="field">
    <label id="idLabel" for="userId">👤 Enrollment / User ID</label>
    <input id="userId" type="text" autocomplete="username"
           placeholder="Enter enrollment number">
  </div>

  <div class="field">
    <label for="password">🔑 Password</label>
    <input id="password" type="password" autocomplete="current-password"
           placeholder="Enter password">
  </div>

  <button class="login" id="loginBtn" type="button" onclick="login()">
    🔓 Login
  </button>

  <div id="loading" class="loading">⏳ Checking account...</div>
  <div id="message"></div>
  <div id="apiStatus">Checking API...</div>

  <a href="register.html" class="register" id="registerLink">
    📝 Create New Student Account
  </a>

  <div class="info" id="roleInfo">
    <b>Student:</b> Register first and wait for admin approval.
  </div>

</div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycby2wlNgfHgpJjKhYpEx6sEPJsy5NhN2MwdAEF3h6v1l3RsOONTkL42wdGonfXWv9DogEg/exec";

let selectedRole = "student";

const userIdInput = document.getElementById("userId");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const loading = document.getElementById("loading");
const message = document.getElementById("message");
const apiStatus = document.getElementById("apiStatus");
const registerLink = document.getElementById("registerLink");
const roleInfo = document.getElementById("roleInfo");

function selectRole(role){
  selectedRole = role;

  document.querySelectorAll(".role-tab")
    .forEach(btn => btn.classList.remove("active"));

  document.getElementById(role + "Tab").classList.add("active");

  if(role === "admin"){
    document.getElementById("idLabel").textContent = "🔐 Admin ID";
    userIdInput.placeholder = "Enter Admin ID";
    registerLink.style.display = "none";
    roleInfo.innerHTML =
      "<b>Administrator:</b> Full system access including user approval, attendance management and reset controls.";
  }
  else if(role === "editor"){
    document.getElementById("idLabel").textContent = "👨‍🏫 Editor User ID";
    userIdInput.placeholder = "Enter Editor User ID";
    registerLink.style.display = "none";
    roleInfo.innerHTML =
      "<b>Editor:</b> Can mark, edit and save attendance and generate reports. Cannot approve users, delete attendance or reset the server.";
  }
  else{
    document.getElementById("idLabel").textContent = "👤 Enrollment Number";
    userIdInput.placeholder = "Enter enrollment number";
    registerLink.style.display = "block";
    roleInfo.innerHTML =
      "<b>Student:</b> Register first and wait for admin approval.";
  }

  clearMessage();
  userIdInput.focus();
}

function clearMessage(){
  message.textContent = "";
  message.className = "";
}

function showMessage(text,type){
  message.textContent = text;
  message.className = type || "";
}

async function login(){

  const id = userIdInput.value.trim();
  const pass = passwordInput.value;

  clearMessage();

  if(!id){
    showMessage("❌ Please enter your ID.", "error");
    userIdInput.focus();
    return;
  }

  if(!pass){
    showMessage("❌ Please enter your password.", "error");
    passwordInput.focus();
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "⏳ Logging in...";
  loading.style.display = "block";

  try{

    let url;

    if(selectedRole === "admin"){
      url =
        API_URL +
        "?action=adminLogin" +
        "&userId=" + encodeURIComponent(id) +
        "&password=" + encodeURIComponent(pass);
    }
    else{
      /*
       * Both Student and Editor accounts use the normal
       * user login. The server returns the actual Role.
       */
      url =
        API_URL +
        "?action=login" +
        "&enrollment=" + encodeURIComponent(id) +
        "&password=" + encodeURIComponent(pass);
    }

    const response = await fetch(url,{
      method:"GET",
      cache:"no-store",
      redirect:"follow"
    });

    const text = await response.text();

    let result;
    try{
      result = JSON.parse(text);
    }catch(e){
      throw new Error("Invalid response from server: " + text);
    }

    console.log("LOGIN RESPONSE:",result);

    if(result.success !== true){

      showMessage(
        "❌ " + (result.message || "Login failed."),
        "error"
      );
      return;
    }

    if(!result.token){
      throw new Error("Login succeeded but no session token was returned.");
    }

    const returnedUser = result.user || {};
    let actualRole =
      String(
        result.role ||
        returnedUser.role ||
        (selectedRole === "admin" ? "admin" : "student")
      ).toLowerCase();

    if(actualRole === "administrator") actualRole = "admin";

    /*
     * Prevent an Editor/Student from being treated as Admin
     * merely because the frontend tab was selected.
     */
    if(selectedRole === "admin" && actualRole !== "admin"){
      throw new Error("Server did not return an Administrator role.");
    }

    if(selectedRole === "editor" && actualRole === "student"){
      throw new Error("This account is a Student account, not an Editor account.");
    }

    sessionStorage.setItem("BP7_LOGGED_IN","true");
    sessionStorage.setItem("BP7_SESSION",result.token);

    sessionStorage.setItem(
      "BP7_USER_ID",
      returnedUser.id || returnedUser.userId || id
    );

    sessionStorage.setItem(
      "BP7_USER_NAME",
      returnedUser.name || id
    );

    sessionStorage.setItem(
      "BP7_ENROLLMENT",
      returnedUser.enrollment || (actualRole === "admin" ? "ADMIN" : id)
    );

    sessionStorage.setItem("BP7_ROLE",actualRole);

    showMessage(
      "✅ Login successful! Opening " +
      (actualRole === "admin" ? "Admin Panel..." :
       actualRole === "editor" ? "Editor Panel..." :
       "Dashboard..."),
      "success"
    );

    setTimeout(function(){

      if(actualRole === "admin"){
        window.location.href = "admin.html";
      }
      else if(actualRole === "editor"){
        /*
         * Editor can use the same dashboard/attendance pages,
         * while server-side permissions control what they can do.
         */
        window.location.href = "dashboard.html";
      }
      else{
        window.location.href = "dashboard.html";
      }

    },500);

  }
  catch(error){

    console.error("LOGIN ERROR:",error);

    showMessage(
      "❌ " + (error.message || "Unable to connect to server."),
      "error"
    );

  }
  finally{

    loginBtn.disabled = false;
    loginBtn.textContent = "🔓 Login";
    loading.style.display = "none";

  }
}

async function checkAPI(){

  try{

    const response = await fetch(API_URL,{
      method:"GET",
      cache:"no-store"
    });

    const text = await response.text();

    let result;
    try{
      result = JSON.parse(text);
    }catch(e){
      throw new Error("Invalid API response");
    }

    if(result.success === true){

      apiStatus.textContent = "🟢 Server connected";
      apiStatus.className = "success";

    }else{

      apiStatus.textContent = "🟠 Server responded";
      apiStatus.className = "success";

    }

  }
  catch(error){

    console.error("API CHECK:",error);

    apiStatus.textContent =
      "🔴 Unable to connect to Apps Script";

    apiStatus.className = "error";

  }
}

userIdInput.addEventListener("keydown",function(event){
  if(event.key === "Enter") passwordInput.focus();
});

passwordInput.addEventListener("keydown",function(event){
  if(event.key === "Enter") login();
});

checkAPI();
</script>

</body>
</html>
