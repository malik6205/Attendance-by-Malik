<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>B.Pharmacy Attendance | Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --primary: #5b4bb7;
    --secondary: #8e63ce;
    --accent: #00b894;
    --danger: #e74c3c;
    --dark: #17142b;
    --white: #ffffff;
}

body {
    min-height: 100vh;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(255,255,255,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(255,255,255,.12),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #211b42,
            #5b4bb7,
            #9b6fd1
        );

    color: white;
    padding: 20px;
}

.login-container {
    width: 100%;
    max-width: 430px;
}

.login-card {
    width: 100%;
    padding: 30px 25px;
    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.20),
            rgba(255,255,255,.08)
        );

    border: 1px solid rgba(255,255,255,.25);

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    box-shadow:
        0 25px 70px rgba(0,0,0,.35);

    text-align: center;
}

.logo {
    width: 85px;
    height: 85px;

    border-radius: 22px;

    object-fit: cover;

    margin-bottom: 15px;

    border: 3px solid rgba(255,255,255,.35);

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);
}

h1 {
    font-size: 25px;
    margin-bottom: 5px;
}

.subtitle {
    font-size: 13px;
    opacity: .75;
    margin-bottom: 25px;
}

.form-group {
    text-align: left;
    margin-bottom: 14px;
}

.form-group label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 6px;
    opacity: .9;
}

.form-group input {
    width: 100%;
    padding: 14px;

    border: 1px solid rgba(255,255,255,.2);
    border-radius: 13px;

    outline: none;

    background: rgba(255,255,255,.95);
    color: #111827;

    font-size: 15px;

    transition: .2s;
}

.form-group input:focus {
    border-color: white;

    box-shadow:
        0 0 0 3px rgba(255,255,255,.15);
}

.login-btn {
    width: 100%;

    margin-top: 5px;

    padding: 14px;

    border: none;
    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #00b894,
            #00cec9
        );

    color: white;

    font-size: 15px;
    font-weight: 800;

    cursor: pointer;

    transition: .2s;
}

.login-btn:hover {
    transform: translateY(-2px);

    box-shadow:
        0 10px 25px rgba(0,0,0,.2);
}

.login-btn:active {
    transform: scale(.98);
}

.register-btn {
    width: 100%;

    margin-top: 10px;

    padding: 13px;

    border-radius: 13px;

    border: 1px solid rgba(255,255,255,.3);

    background: rgba(255,255,255,.10);

    color: white;

    font-weight: 700;

    cursor: pointer;

    transition: .2s;
}

.register-btn:hover {
    background: rgba(255,255,255,.18);
}

.message {
    min-height: 24px;

    margin-top: 12px;

    font-size: 12px;

    font-weight: 700;
}

.success {
    color: #69f0ae;
}

.error {
    color: #ffb3b3;
}

.info-box {
    margin-top: 20px;

    padding: 12px;

    border-radius: 12px;

    background: rgba(255,255,255,.08);

    font-size: 11px;

    line-height: 1.5;

    opacity: .8;
}

.footer {
    margin-top: 18px;

    font-size: 11px;

    opacity: .55;
}

/* Loading */

.loading {
    display: none;

    width: 18px;
    height: 18px;

    margin: 0 auto;

    border: 3px solid rgba(255,255,255,.4);
    border-top-color: white;

    border-radius: 50%;

    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* Mobile */

@media(max-width:500px) {

    body {
        padding: 14px;
    }

    .login-card {
        padding: 25px 20px;
        border-radius: 23px;
    }

    h1 {
        font-size: 22px;
    }

}
</style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <!-- Logo -->
        <img
            src="pic/1.jpg"
            class="logo"
            alt="B.Pharmacy">

        <h1>🔐 Welcome Back</h1>

        <div class="subtitle">
            B.Pharmacy Attendance Management System
        </div>


        <!-- Login Form -->

        <form id="loginForm">

            <div class="form-group">

                <label for="userId">
                    👤 User ID
                </label>

                <input
                    type="text"
                    id="userId"
                    placeholder="Enter your User ID"
                    autocomplete="username"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    🔑 Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginButton">

                🔓 Login

            </button>

        </form>


        <div
            class="loading"
            id="loading">
        </div>


        <div
            class="message"
            id="message">
        </div>


        <!-- Registration -->

        <button
            class="register-btn"
            onclick="goRegister()">

            📝 Create New Account

        </button>


        <div class="info-box">

            New users must register first.
            <br>

            Your account will remain
            <b>pending</b> until an administrator
            approves it.

        </div>


        <div class="footer">

            B.Pharmacy • 7th Semester

        </div>

    </div>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT API
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycby2wlNgfHgpJjKhYpEx6sEPJsy5NhN2MwdAEF3h6v1l3RsOONTkL42wdGonfXWv9DogEg/exec";


/* =====================================================
   ELEMENTS
   ===================================================== */

const loginForm =
    document.getElementById("loginForm");

const userIdInput =
    document.getElementById("userId");

const passwordInput =
    document.getElementById("password");

const message =
    document.getElementById("message");

const loginButton =
    document.getElementById("loginButton");

const loading =
    document.getElementById("loading");


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

}


/* =====================================================
   LOADING
   ===================================================== */

function setLoading(status) {

    if (status) {

        loginButton.disabled = true;

        loginButton.style.opacity = ".6";

        loginButton.textContent =
            "Checking...";

        loading.style.display =
            "block";

    } else {

        loginButton.disabled = false;

        loginButton.style.opacity = "1";

        loginButton.textContent =
            "🔓 Login";

        loading.style.display =
            "none";

    }

}


/* =====================================================
   LOGIN
   ===================================================== */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const userId =
            userIdInput.value.trim();

        const password =
            passwordInput.value.trim();


        if (!userId || !password) {

            showMessage(
                "⚠️ Please enter User ID and Password.",
                "error"
            );

            return;
        }


        setLoading(true);

        showMessage(
            "Checking account...",
            "success"
        );


        try {

            /*
             * Send login information
             * to Google Apps Script.
             */

            const url =
                API_URL +
                "?action=login" +
                "&userId=" +
                encodeURIComponent(userId) +
                "&password=" +
                encodeURIComponent(password);


            const response =
                await fetch(url, {
                    method: "GET",
                    cache: "no-store"
                });


            if (!response.ok) {

                throw new Error(
                    "Server error"
                );

            }


            const result =
                await response.json();


            console.log(
                "Login response:",
                result
            );


            /* ==========================================
               LOGIN SUCCESS
               ========================================== */

            if (
                result.success === true &&
                result.approved === true
            ) {

                /*
                 * Save session information.
                 *
                 * Do NOT store the password.
                 */

                const session = {

                    loggedIn: true,

                    userId:
                        result.userId ||
                        userId,

                    name:
                        result.name ||
                        "",

                    enrollment:
                        result.enrollment ||
                        "",

                    role:
                        result.role ||
                        "student",

                    loginTime:
                        Date.now()

                };


                sessionStorage.setItem(
                    "BP7_SESSION",
                    JSON.stringify(session)
                );


                /*
                 * Also store a simple login flag.
                 */

                sessionStorage.setItem(
                    "BP7_LOGGED_IN",
                    "true"
                );


                showMessage(
                    "✅ Login successful. Opening dashboard...",
                    "success"
                );


                /*
                 * Redirect to dashboard.
                 */

                setTimeout(
                    function() {

                        window.location.href =
                            "dashboard.html";

                    },
                    500
                );


                return;
            }


            /* ==========================================
               ACCOUNT NOT APPROVED
               ========================================== */

            if (
                result.success === true &&
                result.approved === false
            ) {

                showMessage(
                    "⏳ Your account is waiting for admin approval.",
                    "error"
                );

                passwordInput.value = "";

                setLoading(false);

                return;
            }


            /* ==========================================
               INVALID LOGIN
               ========================================== */

            showMessage(
                result.message ||
                "❌ Invalid User ID or Password.",
                "error"
            );


            passwordInput.value = "";

            setLoading(false);

        }

        catch(error) {

            console.error(
                "Login error:",
                error
            );


            showMessage(
                "❌ Unable to connect to server. Please try again.",
                "error"
            );


            setLoading(false);

        }

    }
);


/* =====================================================
   REGISTER
   ===================================================== */

function goRegister() {

    window.location.href =
        "register.html";

}


/* =====================================================
   PREVENT ACCESS IF ALREADY LOGGED IN
   ===================================================== */

function checkExistingSession() {

    const logged =
        sessionStorage.getItem(
            "BP7_LOGGED_IN"
        );

    const session =
        sessionStorage.getItem(
            "BP7_SESSION"
        );


    if (
        logged === "true" &&
        session
    ) {

        try {

            const data =
                JSON.parse(session);


            /*
             * Only redirect if the session
             * is valid.
             */

            if (
                data.loggedIn === true &&
                data.userId
            ) {

                window.location.replace(
                    "dashboard.html"
                );

            }

        }

        catch(error) {

            sessionStorage.clear();

        }

    }

}


/* =====================================================
   PAGE START
   ===================================================== */

checkExistingSession();

</script>

</body>
</html>
