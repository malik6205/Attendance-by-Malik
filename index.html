<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>B.Pharmacy Attendance - Login</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:
    radial-gradient(circle at 10% 10%,#ffffff22,transparent 30%),
    radial-gradient(circle at 90% 90%,#ffb6d522,transparent 30%),
    linear-gradient(135deg,#403579,#6655b5,#8067c9);

    color:white;
}

.login-card{
    width:100%;
    max-width:540px;

    padding:38px;

    border-radius:32px;

    background:rgba(255,255,255,.15);

    border:1px solid rgba(255,255,255,.3);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    box-shadow:0 30px 80px rgba(0,0,0,.3);

    text-align:center;
}

.logo{
    width:105px;
    height:105px;

    object-fit:cover;

    border-radius:28px;

    border:4px solid rgba(255,255,255,.4);

    margin-bottom:22px;
}

h1{
    font-size:32px;
    margin-bottom:8px;
}

.subtitle{
    opacity:.85;
    margin-bottom:30px;
}

label{
    display:block;
    text-align:left;

    margin:0 0 7px 5px;

    font-weight:bold;
}

input{
    width:100%;
    height:60px;

    border:0;
    outline:none;

    border-radius:17px;

    padding:0 18px;

    font-size:17px;

    margin-bottom:18px;

    background:#fff;
    color:#222;
}

button{
    width:100%;
    height:60px;

    border:0;
    border-radius:17px;

    background:linear-gradient(135deg,#00bfa5,#00ced1);

    color:white;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.register{
    display:block;

    margin-top:18px;

    padding:17px;

    border:1px solid #ffffff55;

    border-radius:17px;

    color:white;

    text-decoration:none;

    font-weight:bold;

    background:#ffffff10;
}

.info{
    margin-top:20px;

    padding:17px;

    border-radius:16px;

    background:#ffffff10;

    font-size:13px;

    line-height:1.6;
}

#apiStatus{
    margin-top:18px;

    font-size:13px;

    font-weight:bold;
}

#message{
    min-height:25px;

    margin-top:12px;

    font-size:14px;

    font-weight:bold;
}

.success{
    color:#7dffb2;
}

.error{
    color:#ffb5b5;
}

.loading{
    display:none;

    margin-top:10px;

    font-size:13px;
}

@media(max-width:600px){

    .login-card{
        padding:28px 20px;
    }

    h1{
        font-size:27px;
    }

    .logo{
        width:90px;
        height:90px;
    }

}

</style>

</head>

<body>

<div class="login-card">

<img
    src="pic/1.jpg"
    class="logo"
    alt="B.Pharmacy"
>

<h1>🔐 Welcome Back</h1>

<div class="subtitle">
B.Pharmacy Attendance Management System
</div>

<label for="userId">
👤 Enrollment / User ID
</label>

<input
    id="userId"
    type="text"
    placeholder="Enter Enrollment Number"
    autocomplete="username"
>

<label for="password">
🔑 Password
</label>

<input
    id="password"
    type="password"
    placeholder="Enter Password"
    autocomplete="current-password"
>

<button
    id="loginBtn"
    onclick="login()"
>
🔓 Login
</button>

<div
    id="loading"
    class="loading"
>
⏳ Checking account...
</div>

<div id="message"></div>

<div id="apiStatus">
Checking API...
</div>

<a
    href="register.html"
    class="register"
>
📝 Create New Account
</a>

<div class="info">

New users must register first.<br>

Your account remains <b>Pending</b>
until an administrator approves it.

</div>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT DEPLOYMENT
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbysZ2VWKZ9QgqF7STV98GPpeKQl6Axn8t0zWB5qqQls/exec";


/* =====================================================
   ELEMENTS
   ===================================================== */

const userId =
document.getElementById("userId");

const password =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const message =
document.getElementById("message");

const loading =
document.getElementById("loading");

const apiStatus =
document.getElementById("apiStatus");


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(text,type){

    message.textContent = text;

    message.className = type || "";

}


/* =====================================================
   API CHECK
   ===================================================== */

async function checkAPI(){

    try{

        const response =
        await fetch(
            API_URL,
            {
                method:"GET",
                cache:"no-store"
            }
        );

        const text =
        await response.text();

        console.log(
            "API RESPONSE:",
            text
        );

        let result;

        try{

            result =
            JSON.parse(text);

        }catch(e){

            result = null;

        }


        if(
            result &&
            result.success === true
        ){

            apiStatus.textContent =
            "🟢 B.Pharmacy Attendance API is working";

            apiStatus.style.color =
            "#7dffb2";

        }

        else{

            apiStatus.textContent =
            "🟢 API connected";

            apiStatus.style.color =
            "#7dffb2";

        }

    }

    catch(error){

        console.error(
            "API ERROR:",
            error
        );

        apiStatus.textContent =
        "🔴 API connection failed";

        apiStatus.style.color =
        "#ffb5b5";

    }

}


/* =====================================================
   LOGIN
   ===================================================== */

async function login(){

    const enrollment =
    userId.value.trim();

    const pass =
    password.value.trim();


    /* EMPTY USER */

    if(!enrollment){

        showMessage(
            "❌ Please enter Enrollment / User ID.",
            "error"
        );

        userId.focus();

        return;

    }


    /* EMPTY PASSWORD */

    if(!pass){

        showMessage(
            "❌ Please enter password.",
            "error"
        );

        password.focus();

        return;

    }


    /* LOADING */

    loginBtn.disabled = true;

    loginBtn.textContent =
    "⏳ Logging in...";

    loading.style.display =
    "block";

    showMessage("","");


    try{

        /*
         IMPORTANT:

         Backend expects:

         action=login
         enrollment=...
         password=...
        */

        const url =
        API_URL +
        "?action=login" +
        "&enrollment=" +
        encodeURIComponent(enrollment) +
        "&password=" +
        encodeURIComponent(pass);


        console.log(
            "LOGIN REQUEST:",
            url.replace(
                /password=[^&]*/,
                "password=******"
            )
        );


        const response =
        await fetch(
            url,
            {
                method:"GET",
                redirect:"follow",
                cache:"no-store"
            }
        );


        const text =
        await response.text();


        console.log(
            "LOGIN RESPONSE:",
            text
        );


        let result;


        try{

            result =
            JSON.parse(text);

        }

        catch(error){

            throw new Error(
                "Invalid response from Apps Script: " +
                text
            );

        }


        /* =============================================
           LOGIN SUCCESS
           ============================================= */

        if(
            result.success === true
        ){

            console.log(
                "LOGIN SUCCESS:",
                result
            );


            /*
             CLEAR OLD SESSION
            */

            sessionStorage.clear();


            /*
             SAVE LOGIN
            */

            sessionStorage.setItem(
                "BP7_LOGGED_IN",
                "true"
            );


            /*
             SAVE TOKEN

             Backend returns:
             token
            */

            if(result.token){

                sessionStorage.setItem(
                    "BP7_SESSION",
                    result.token
                );

            }


            /*
             SAVE USER ID
            */

            sessionStorage.setItem(
                "BP7_USER_ID",
                result.user &&
                result.user.id
                    ? result.user.id
                    : enrollment
            );


            /*
             SAVE USER NAME
            */

            sessionStorage.setItem(
                "BP7_USER_NAME",
                result.user &&
                result.user.name
                    ? result.user.name
                    : enrollment
            );


            /*
             SAVE ENROLLMENT
            */

            sessionStorage.setItem(
                "BP7_ENROLLMENT",
                result.user &&
                result.user.enrollment
                    ? result.user.enrollment
                    : enrollment
            );


            /*
             SAVE ROLE
            */

            const role =
            result.role ||
            (
                enrollment.toUpperCase() === "ADMIN"
                ? "admin"
                : "student"
            );


            sessionStorage.setItem(
                "BP7_ROLE",
                role
            );


            showMessage(
                "✅ Login successful! Redirecting...",
                "success"
            );


            /*
             ADMIN
            */

            if(
                role.toLowerCase() === "admin"
            ){

                setTimeout(function(){

                    window.location.href =
                    "admin.html";

                },700);

            }


            /*
             STUDENT
            */

            else{

                setTimeout(function(){

                    window.location.href =
                    "dashboard.html";

                },700);

            }


            return;

        }


        /* =============================================
           LOGIN FAILED
           ============================================= */

        showMessage(
            "❌ " +
            (
                result.message ||
                "Invalid Enrollment / User ID or Password."
            ),
            "error"
        );

    }


    catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        showMessage(
            "❌ " + error.message,
            "error"
        );

    }


    finally{

        loginBtn.disabled =
        false;

        loginBtn.textContent =
        "🔓 Login";

        loading.style.display =
        "none";

    }

}


/* =====================================================
   ENTER KEY
   ===================================================== */

userId.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            password.focus();

        }

    }
);


password.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            login();

        }

    }
);


/* =====================================================
   START
   ===================================================== */

checkAPI();

</script>

</body>

</html>
