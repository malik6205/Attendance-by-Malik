<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B.Pharmacy Attendance | Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;

    font-family:
        system-ui,
        -apple-system,
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(155,135,255,.35),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(255,117,168,.30),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #17152f 0%,
            #493c78 50%,
            #8e5478 100%
        );

    color:white;
}

/* ---------- LOGIN CONTAINER ---------- */

.login-container{
    width:100%;
    max-width:430px;
}

.login-card{
    padding:30px 25px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.18),
            rgba(255,255,255,.07)
        );

    border:1px solid rgba(255,255,255,.25);

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    box-shadow:
        0 25px 70px rgba(0,0,0,.40);

    text-align:center;

    animation:cardIn .45s ease;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(20px) scale(.98);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* ---------- LOGO ---------- */

.logo{
    width:88px;
    height:88px;

    object-fit:cover;

    border-radius:23px;

    margin-bottom:15px;

    border:2px solid rgba(255,255,255,.35);

    box-shadow:
        0 12px 30px rgba(0,0,0,.30);
}

/* ---------- TITLE ---------- */

.title{
    font-size:25px;
    font-weight:800;

    margin-bottom:5px;
}

.subtitle{
    font-size:12px;
    opacity:.75;

    margin-bottom:25px;
}

/* ---------- FORM ---------- */

.form-group{
    text-align:left;
    margin-bottom:15px;
}

.form-group label{
    display:block;

    font-size:12px;
    font-weight:700;

    margin-bottom:6px;

    opacity:.9;
}

.input-wrapper{
    position:relative;
}

.input-icon{
    position:absolute;

    left:13px;
    top:50%;

    transform:translateY(-50%);

    font-size:16px;

    opacity:.65;
}

input{
    width:100%;

    padding:13px 13px 13px 42px;

    border:none;
    outline:none;

    border-radius:13px;

    background:#fff;

    color:#111827;

    font-size:14px;

    transition:.2s;
}

input:focus{
    box-shadow:
        0 0 0 3px rgba(144,202,249,.35);
}

/* ---------- LOGIN BUTTON ---------- */

.login-button{
    width:100%;

    padding:14px;

    border:none;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #1976d2,
            #1565c0
        );

    color:white;

    font-size:14px;

    font-weight:800;

    cursor:pointer;

    box-shadow:
        0 8px 20px rgba(25,118,210,.30);

    transition:.15s;
}

.login-button:hover{
    transform:translateY(-1px);
}

.login-button:active{
    transform:scale(.98);
}

.login-button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* ---------- REGISTER BUTTON ---------- */

.register-button{
    width:100%;

    margin-top:10px;

    padding:13px;

    border-radius:13px;

    background:rgba(255,255,255,.10);

    border:1px solid rgba(255,255,255,.22);

    color:white;

    font-size:13px;

    font-weight:700;

    cursor:pointer;

    transition:.15s;
}

.register-button:hover{
    background:rgba(255,255,255,.18);
}

/* ---------- ERROR ---------- */

.message{
    min-height:20px;

    margin-top:12px;

    font-size:12px;

    font-weight:700;

    line-height:1.5;
}

.message.error{
    color:#ffb4b4;
}

.message.success{
    color:#8affbd;
}

/* ---------- FOOTER ---------- */

.footer{
    margin-top:20px;

    font-size:10px;

    opacity:.55;

    line-height:1.6;
}

/* ---------- LOADING ---------- */

.loading{
    display:inline-flex;
    align-items:center;
    gap:8px;
}

.spinner{
    width:15px;
    height:15px;

    border:2px solid rgba(255,255,255,.4);

    border-top-color:white;

    border-radius:50%;

    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* ---------- MOBILE ---------- */

@media(max-width:480px){

    body{
        padding:15px;
    }

    .login-card{
        padding:25px 18px;
        border-radius:24px;
    }

    .title{
        font-size:22px;
    }

    .logo{
        width:78px;
        height:78px;
    }
}
</style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <!-- LOGO -->
        <img
            src="pic/1.jpg"
            alt="B.Pharmacy"
            class="logo"
            onerror="this.style.display='none'"
        >

        <!-- TITLE -->
        <div class="title">
            🔐 B.Pharmacy Login
        </div>

        <div class="subtitle">
            7th Semester Attendance Management System
        </div>


        <!-- ENROLLMENT -->
        <div class="form-group">

            <label for="enrollment">
                Enrollment Number
            </label>

            <div class="input-wrapper">

                <span class="input-icon">
                    🎓
                </span>

                <input
                    id="enrollment"
                    type="text"
                    placeholder="Example: AJU/230001"
                    autocomplete="username"
                >

            </div>

        </div>


        <!-- PASSWORD -->
        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="input-wrapper">

                <span class="input-icon">
                    🔑
                </span>

                <input
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >

            </div>

        </div>


        <!-- LOGIN -->
        <button
            id="loginButton"
            class="login-button"
            onclick="login()"
        >
            🔓 Login
        </button>


        <!-- REGISTER -->
        <button
            class="register-button"
            onclick="goToRegister()"
        >
            📝 Create New Account
        </button>


        <!-- MESSAGE -->
        <div
            id="message"
            class="message"
        ></div>


        <!-- FOOTER -->
        <div class="footer">

            B.Pharmacy • 7th Semester<br>

            Attendance Management System

        </div>

    </div>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT BACKEND
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycby2wlNgfHgpJjKhYpEx6sEPJsy5NhN2MwdAEF3h6v1l3RsOONTkL42wdGonfXWv9DogEg/exec";


/* =====================================================
   CHECK EXISTING LOGIN
===================================================== */

(function checkExistingLogin(){

    const user =
        sessionStorage.getItem("BP_USER");

    if(user){

        /*
         User is already logged in.
         Send directly to dashboard.
        */

        window.location.replace(
            "dashboard.html"
        );

    }

})();


/* =====================================================
   LOGIN FUNCTION
===================================================== */

async function login(){

    const enrollment =
        document
        .getElementById("enrollment")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;


    /* ---------- VALIDATION ---------- */

    if(!enrollment){

        showMessage(
            "Please enter your enrollment number.",
            "error"
        );

        document
        .getElementById("enrollment")
        .focus();

        return;
    }


    if(!password){

        showMessage(
            "Please enter your password.",
            "error"
        );

        document
        .getElementById("password")
        .focus();

        return;
    }


    /* ---------- BUTTON ---------- */

    const button =
        document.getElementById(
            "loginButton"
        );

    button.disabled = true;

    button.innerHTML = `
        <span class="loading">
            <span class="spinner"></span>
            Checking...
        </span>
    `;


    showMessage("", "");


    try{

        /* ---------- SEND REQUEST ---------- */

        const response =
            await fetch(

                API_URL,

                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                        "text/plain;charset=utf-8"
                    },

                    body:JSON.stringify({

                        action:"login",

                        enrollment:
                            enrollment,

                        password:
                            password

                    })

                }

            );


        /* ---------- RESPONSE ---------- */

        const result =
            await response.json();


        console.log(
            "Login response:",
            result
        );


        /* ---------- SUCCESS ---------- */

        if(result.success === true){

            /*
             Store user information
             in the browser session.
            */

            const userData =
                result.user || {

                    enrollment:
                        enrollment

                };


            sessionStorage.setItem(
                "BP_USER",
                JSON.stringify(
                    userData
                )
            );


            /*
             Optional token from
             Google Apps Script.
            */

            if(result.token){

                sessionStorage.setItem(
                    "BP_TOKEN",
                    result.token
                );

            }


            showMessage(
                "✅ Login successful. Opening dashboard...",
                "success"
            );


            /*
             Small delay so the
             success message is visible.
            */

            setTimeout(function(){

                window.location.replace(
                    "dashboard.html"
                );

            },500);

        }


        /* ---------- NOT APPROVED ---------- */

        else{

            showMessage(

                result.message ||
                "Login failed. Please check your details.",

                "error"

            );

            resetLoginButton();

        }

    }


    /* ---------- CONNECTION ERROR ---------- */

    catch(error){

        console.error(
            "Login error:",
            error
        );

        showMessage(

            "❌ Unable to connect to the server. Please check your internet connection.",

            "error"

        );

        resetLoginButton();

    }

}


/* =====================================================
   REGISTER PAGE
===================================================== */

function goToRegister(){

    window.location.href =
        "register.html";

}


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    const message =
        document.getElementById(
            "message"
        );

    message.textContent =
        text;

    message.className =
        "message " +
        (type || "");

}


/* =====================================================
   RESET LOGIN BUTTON
===================================================== */

function resetLoginButton(){

    const button =
        document.getElementById(
            "loginButton"
        );

    button.disabled = false;

    button.innerHTML =
        "🔓 Login";

}


/* =====================================================
   ENTER KEY LOGIN
===================================================== */

document
.getElementById("password")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            login();

        }

    }
);


/* =====================================================
   ENTER KEY FROM ENROLLMENT
===================================================== */

document
.getElementById("enrollment")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            document
            .getElementById("password")
            .focus();

        }

    }
);

</script>

</body>
</html>
