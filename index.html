<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>B.Pharmacy Attendance — Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:#fff;
    background:
        radial-gradient(circle at 15% 10%,#ffffff35,transparent 28%),
        radial-gradient(circle at 85% 90%,#ffb6d535,transparent 30%),
        linear-gradient(135deg,#211b3d,#514483,#9f6f8f);
}

.login-container{
    width:100%;
    max-width:430px;
}

.login-card{
    padding:28px;
    border-radius:28px;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.28);
    backdrop-filter:blur(20px);
    box-shadow:0 25px 70px rgba(0,0,0,.35);
}

.logo{
    width:85px;
    height:85px;
    object-fit:cover;
    border-radius:24px;
    display:block;
    margin:0 auto 15px;
    box-shadow:0 10px 30px #0005;
}

h1{
    text-align:center;
    font-size:24px;
}

.subtitle{
    text-align:center;
    font-size:12px;
    opacity:.8;
    margin:6px 0 22px;
}

.mode{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:15px;
}

.mode button{
    border:1px solid #ffffff35;
    background:#ffffff15;
    color:#fff;
    padding:12px;
    border-radius:12px;
    cursor:pointer;
    font-weight:700;
}

.mode button.active{
    background:#fff;
    color:#392d61;
}

.form{
    display:none;
}

.form.active{
    display:block;
}

label{
    display:block;
    font-size:12px;
    font-weight:700;
    margin:10px 0 5px;
}

input{
    width:100%;
    padding:13px;
    border:0;
    outline:none;
    border-radius:12px;
    background:#fff;
    color:#111827;
    font-size:15px;
}

.login-btn{
    width:100%;
    margin-top:15px;
    padding:13px;
    border:0;
    border-radius:12px;
    background:#1976d2;
    color:#fff;
    font-weight:800;
    font-size:15px;
    cursor:pointer;
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.register{
    display:block;
    text-align:center;
    margin-top:16px;
    color:#fff;
    text-decoration:none;
    font-size:13px;
    font-weight:700;
}

.message{
    min-height:22px;
    margin-top:12px;
    text-align:center;
    font-size:12px;
    font-weight:700;
}

.success{
    color:#69f0ae;
}

.error{
    color:#ffb4b4;
}

.loading{
    display:none;
    text-align:center;
    margin-top:10px;
    font-size:12px;
}

.footer{
    text-align:center;
    margin-top:18px;
    font-size:11px;
    opacity:.65;
}

@media(max-width:450px){
    .login-card{
        padding:22px;
    }
}
</style>
</head>

<body>

<div class="login-container">

<div class="login-card">

<img
    src="pic/1.jpg"
    class="logo"
    alt="B.Pharmacy"
    onerror="this.style.display='none'"
>

<h1>🔐 Attendance Login</h1>

<div class="subtitle">
B.Pharmacy • 7th Semester
</div>

<div class="mode">

<button
    id="studentMode"
    class="active"
    onclick="selectMode('student')">
    👨‍🎓 Student
</button>

<button
    id="adminMode"
    onclick="selectMode('admin')">
    👨‍💼 Admin
</button>

</div>


<!-- ================= STUDENT LOGIN ================= -->

<div id="studentForm" class="form active">

<label>Student ID</label>

<input
    id="studentId"
    type="text"
    placeholder="Enter your ID"
    autocomplete="username"
>

<label>Password</label>

<input
    id="studentPassword"
    type="password"
    placeholder="Enter password"
    autocomplete="current-password"
>

<button
    class="login-btn"
    id="studentLoginBtn"
    onclick="studentLogin()">
    🔓 Student Login
</button>

</div>


<!-- ================= ADMIN LOGIN ================= -->

<div id="adminForm" class="form">

<label>Admin ID</label>

<input
    id="adminId"
    type="text"
    placeholder="Enter admin ID"
    autocomplete="username"
>

<label>Admin Password</label>

<input
    id="adminPassword"
    type="password"
    placeholder="Enter admin password"
    autocomplete="current-password"
>

<button
    class="login-btn"
    id="adminLoginBtn"
    onclick="adminLogin()">
    🔐 Admin Login
</button>

</div>


<div
    id="loading"
    class="loading">
    ⏳ Checking login...
</div>

<div
    id="message"
    class="message">
</div>


<a
    href="register.html"
    class="register">
    📝 New Student? Register here
</a>

<div class="footer">
B.Pharmacy Attendance Management System
</div>

</div>
</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT API
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycby2wlNgfHgpJjKhYpEx6sEPJsy5NhN2MwdAEF3h6v1l3RsOONTkL42wdGonfXWv9DogEg/exec";


/* =====================================================
   MODE
===================================================== */

function selectMode(mode){

    clearMessage();

    document
        .getElementById("studentMode")
        .classList.toggle("active",mode==="student");

    document
        .getElementById("adminMode")
        .classList.toggle("active",mode==="admin");

    document
        .getElementById("studentForm")
        .classList.toggle("active",mode==="student");

    document
        .getElementById("adminForm")
        .classList.toggle("active",mode==="admin");
}


/* =====================================================
   STUDENT LOGIN
===================================================== */

async function studentLogin(){

    const id =
        document
        .getElementById("studentId")
        .value
        .trim();

    const password =
        document
        .getElementById("studentPassword")
        .value;

    if(!id || !password){

        showMessage(
            "Please enter Student ID and Password.",
            "error"
        );

        return;
    }

    setLoading(true);

    try{

        const result =
            await callAPI({
                action:"login",
                id:id,
                password:password
            });

        console.log("Student login:",result);

        if(result.success){

            saveSession(result,"student");

            showMessage(
                "Login successful. Opening dashboard...",
                "success"
            );

            setTimeout(()=>{
                window.location.href="dashboard.html";
            },500);

        }else{

            showMessage(
                result.message ||
                "Login failed. Check your ID and password.",
                "error"
            );

        }

    }catch(error){

        console.error(error);

        showMessage(
            "Unable to connect to the server.",
            "error"
        );

    }finally{

        setLoading(false);

    }
}


/* =====================================================
   ADMIN LOGIN
===================================================== */

async function adminLogin(){

    const id =
        document
        .getElementById("adminId")
        .value
        .trim();

    const password =
        document
        .getElementById("adminPassword")
        .value;

    if(!id || !password){

        showMessage(
            "Please enter Admin ID and Password.",
            "error"
        );

        return;
    }

    setLoading(true);

    try{

        const result =
            await callAPI({
                action:"adminLogin",
                id:id,
                password:password
            });

        console.log("Admin login:",result);

        if(result.success){

            saveSession(result,"admin");

            showMessage(
                "Admin login successful.",
                "success"
            );

            setTimeout(()=>{
                window.location.href="admin.html";
            },500);

        }else{

            showMessage(
                result.message ||
                "Invalid admin credentials.",
                "error"
            );

        }

    }catch(error){

        console.error(error);

        showMessage(
            "Unable to connect to the server.",
            "error"
        );

    }finally{

        setLoading(false);

    }
}


/* =====================================================
   CALL GOOGLE APPS SCRIPT
===================================================== */

async function callAPI(data){

    const response = await fetch(API_URL,{
        method:"POST",

        headers:{
            "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:JSON.stringify(data)

    });

    if(!response.ok){

        throw new Error(
            "HTTP error "+response.status
        );

    }

    const text =
        await response.text();

    console.log("API response:",text);

    try{

        return JSON.parse(text);

    }catch(e){

        throw new Error(
            "Invalid JSON response: "+text
        );

    }
}


/* =====================================================
   SAVE LOGIN SESSION
===================================================== */

function saveSession(result,role){

    sessionStorage.setItem(
        "BP7_LOGGED_IN",
        "true"
    );

    sessionStorage.setItem(
        "BP7_ROLE",
        role
    );

    if(result.token){

        sessionStorage.setItem(
            "BP7_TOKEN",
            result.token
        );

    }

    if(result.user){

        sessionStorage.setItem(
            "BP7_USER",
            JSON.stringify(result.user)
        );

    }

    if(result.userId){

        sessionStorage.setItem(
            "BP7_USER_ID",
            result.userId
        );

    }

    if(result.name){

        sessionStorage.setItem(
            "BP7_USER_NAME",
            result.name
        );

    }
}


/* =====================================================
   UI
===================================================== */

function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.textContent=text;

    box.className=
        "message "+
        (type==="success"?"success":"error");
}


function clearMessage(){

    const box =
        document.getElementById("message");

    box.textContent="";

    box.className="message";
}


function setLoading(value){

    document
        .getElementById("loading")
        .style.display =
        value ? "block":"none";

    document
        .getElementById("studentLoginBtn")
        .disabled=value;

    document
        .getElementById("adminLoginBtn")
        .disabled=value;
}


/* =====================================================
   ENTER KEY LOGIN
===================================================== */

document
    .getElementById("studentPassword")
    .addEventListener(
        "keydown",
        function(e){

            if(e.key==="Enter"){
                studentLogin();
            }

        }
    );


document
    .getElementById("adminPassword")
    .addEventListener(
        "keydown",
        function(e){

            if(e.key==="Enter"){
                adminLogin();
            }

        }
    );


/* =====================================================
   REMOVE OLD SESSION
===================================================== */

if(
    sessionStorage.getItem("BP7_LOGGED_IN")==="true"
){

    const role =
        sessionStorage.getItem("BP7_ROLE");

    if(role==="admin"){

        window.location.href="admin.html";

    }else if(role==="student"){

        window.location.href="dashboard.html";

    }

}

</script>

</body>
</html>
