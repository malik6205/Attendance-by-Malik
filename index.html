<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>B.Pharmacy Attendance - Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

    background:
    radial-gradient(circle at 10% 10%,#ffffff22,transparent 30%),
    radial-gradient(circle at 90% 90%,#ffb6d522,transparent 30%),
    linear-gradient(135deg,#403579,#6655b5,#8067c9);

    color:white;
}

.login-card{
    width:100%;
    max-width:540px;
    padding:38px;
    border-radius:32px;

    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.3);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    box-shadow:0 30px 80px rgba(0,0,0,.3);

    text-align:center;
}

.logo{
    width:105px;
    height:105px;
    object-fit:cover;
    border-radius:28px;
    border:4px solid rgba(255,255,255,.4);
    margin-bottom:22px;
}

h1{
    font-size:32px;
    margin-bottom:8px;
}

.subtitle{
    opacity:.85;
    margin-bottom:30px;
}

label{
    display:block;
    text-align:left;
    margin:0 0 7px 5px;
    font-weight:bold;
}

input{
    width:100%;
    height:60px;
    border:0;
    outline:none;
    border-radius:17px;
    padding:0 18px;
    font-size:17px;
    margin-bottom:18px;
    background:#fff;
    color:#222;
}

button{
    width:100%;
    height:60px;
    border:0;
    border-radius:17px;
    background:linear-gradient(135deg,#00bfa5,#00ced1);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.register{
    display:block;
    margin-top:18px;
    padding:17px;
    border:1px solid #ffffff55;
    border-radius:17px;
    color:white;
    text-decoration:none;
    font-weight:bold;
    background:#ffffff10;
}

.info{
    margin-top:20px;
    padding:17px;
    border-radius:16px;
    background:#ffffff10;
    font-size:13px;
    line-height:1.6;
}

#apiStatus{
    margin-top:18px;
    font-size:13px;
    font-weight:bold;
}

#message{
    min-height:25px;
    margin-top:12px;
    font-size:14px;
    font-weight:bold;
}

.success{
    color:#7dffb2;
}

.error{
    color:#ffb5b5;
}

.loading{
    display:none;
    margin-top:10px;
    font-size:13px;
}

@media(max-width:600px){

    .login-card{
        padding:28px 20px;
    }

    h1{
        font-size:27px;
    }

    .logo{
        width:90px;
        height:90px;
    }
}
</style>
</head>

<body>

<div class="login-card">

<img
    src="pic/1.jpg"
    class="logo"
    alt="B.Pharmacy"
>

<h1>🔐 Welcome Back</h1>

<div class="subtitle">
B.Pharmacy Attendance Management System
</div>

<label for="userId">
👤 User ID
</label>

<input
    id="userId"
    type="text"
    placeholder="Enter User ID"
    autocomplete="username"
>

<label for="password">
🔑 Password
</label>

<input
    id="password"
    type="password"
    placeholder="Enter Password"
    autocomplete="current-password"
>

<button
    id="loginBtn"
    onclick="login()"
>
🔓 Login
</button>

<div
    id="loading"
    class="loading"
>
⏳ Checking account...
</div>

<div
    id="message"
></div>

<div
    id="apiStatus"
>
Checking API...
</div>

<a
    href="register.html"
    class="register"
>
📝 Create New Account
</a>

<div class="info">
New users must register first.<br>
Your account remains <b>Pending</b> until an administrator approves it.
</div>

</div>


<script>

/* =====================================================
   YOUR GOOGLE APPS SCRIPT URL
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycby2wlNgfHgpJjKhYpEx6sEPJsy5NhN2MwdAEF3h6v1l3RsOONTkL42wdGonfXWv9DogEg/exec";


/* =====================================================
   ELEMENTS
===================================================== */

const userId =
document.getElementById("userId");

const password =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const message =
document.getElementById("message");

const loading =
document.getElementById("loading");

const apiStatus =
document.getElementById("apiStatus");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

    message.textContent=text;

    message.className=type || "";

}


/* =====================================================
   API CHECK
===================================================== */

async function checkAPI(){

    try{

        const response =
        await fetch(API_URL + "?action=status");

        const text =
        await response.text();

        console.log(
            "API STATUS:",
            text
        );

        apiStatus.textContent =
        "🟢 B.Pharmacy Attendance API is working";

        apiStatus.style.color="#7dffb2";

    }
    catch(error){

        console.error(error);

        apiStatus.textContent =
        "🔴 API connection failed";

        apiStatus.style.color="#ffb5b5";

    }
}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const id =
    userId.value.trim();

    const pass =
    password.value.trim();


    if(!id){

        showMessage(
            "❌ Please enter User ID.",
            "error"
        );

        userId.focus();

        return;
    }


    if(!pass){

        showMessage(
            "❌ Please enter password.",
            "error"
        );

        password.focus();

        return;
    }


    loginBtn.disabled=true;

    loginBtn.textContent=
    "⏳ Logging in...";

    loading.style.display="block";

    showMessage("","");


    try{

        /*
         IMPORTANT:

         We send login information
         through URL parameters.

         This avoids CORS problems that
         commonly occur with Google Apps Script.
        */

        const url =
        API_URL +
        "?action=login" +
        "&userId=" +
        encodeURIComponent(id) +
        "&password=" +
        encodeURIComponent(pass);


        console.log(
            "LOGIN URL:",
            url
        );


        const response =
        await fetch(url,{
            method:"GET",
            redirect:"follow"
        });


        const text =
        await response.text();


        console.log(
            "LOGIN RESPONSE:",
            text
        );


        let result;


        try{

            result =
            JSON.parse(text);

        }
        catch(e){

            /*
             If your Apps Script returns
             plain text instead of JSON.
            */

            if(
                text.toLowerCase()
                .includes("success")
            ){

                result={
                    success:true,
                    message:"Login successful"
                };

            }else{

                result={
                    success:false,
                    message:text
                };

            }
        }


        /* =============================================
           LOGIN SUCCESS
        ============================================= */

        if(
            result.success === true ||
            result.status === "success" ||
            result.result === "success"
        ){

            /*
             Save session
            */

            sessionStorage.setItem(
                "BP7_LOGGED_IN",
                "true"
            );

            sessionStorage.setItem(
                "BP7_USER_ID",
                id
            );

            sessionStorage.setItem(
                "BP7_USER_NAME",
                result.name || id
            );

            sessionStorage.setItem(
                "BP7_ROLE",
                result.role || "student"
            );


            showMessage(
                "✅ Login successful!",
                "success"
            );


            /*
             ADMIN
             */

            if(
                id.toUpperCase()==="ADMIN" ||
                result.role==="admin"
            ){

                setTimeout(function(){

                    window.location.replace(
                        "admin.html"
                    );

                },500);

            }

            /*
             STUDENT
             */

            else{

                setTimeout(function(){

                    window.location.replace(
                        "dashboard.html"
                    );

                },500);

            }

        }

        /* =============================================
           LOGIN FAILED
        ============================================= */

        else{

            showMessage(
                "❌ " +
                (
                    result.message ||
                    "Invalid User ID or Password."
                ),
                "error"
            );

        }

    }
    catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );

        showMessage(
            "❌ Login connection error. Check your Apps Script deployment.",
            "error"
        );

    }
    finally{

        loginBtn.disabled=false;

        loginBtn.textContent=
        "🔓 Login";

        loading.style.display="none";

    }

}


/* =====================================================
   ENTER KEY
===================================================== */

userId.addEventListener(
    "keydown",
    function(e){

        if(e.key==="Enter"){
            password.focus();
        }

    }
);


password.addEventListener(
    "keydown",
    function(e){

        if(e.key==="Enter"){
            login();
        }

    }
);


/* =====================================================
   START
===================================================== */

checkAPI();

</script>

</body>
</html>
