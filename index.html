<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B.Pharmacy Attendance - Login</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    font-family:Arial,Helvetica,sans-serif;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(255,255,255,.15),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(255,180,220,.15),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #403579,
            #6655b5,
            #8067c9
        );

    color:white;
}

.login-card{

    width:100%;
    max-width:540px;

    padding:40px;

    border-radius:32px;

    background:rgba(255,255,255,.15);

    border:1px solid rgba(255,255,255,.30);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    box-shadow:
        0 30px 80px rgba(0,0,0,.30);

    text-align:center;
}

.logo{

    width:105px;
    height:105px;

    object-fit:cover;

    border-radius:28px;

    border:4px solid rgba(255,255,255,.40);

    margin-bottom:20px;
}

h1{

    font-size:32px;

    margin-bottom:8px;
}

.subtitle{

    opacity:.85;

    margin-bottom:30px;

    line-height:1.5;
}

label{

    display:block;

    text-align:left;

    margin:0 0 7px 5px;

    font-weight:bold;
}

input{

    width:100%;

    height:60px;

    border:0;

    outline:none;

    border-radius:17px;

    padding:0 18px;

    font-size:17px;

    margin-bottom:18px;

    background:white;

    color:#222;
}

input:focus{

    box-shadow:
        0 0 0 3px rgba(255,255,255,.25);
}

button{

    width:100%;

    height:60px;

    border:0;

    border-radius:17px;

    background:
        linear-gradient(
            135deg,
            #00bfa5,
            #00ced1
        );

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

button:hover{

    transform:translateY(-1px);

    box-shadow:
        0 10px 25px rgba(0,0,0,.20);
}

button:disabled{

    opacity:.60;

    cursor:not-allowed;

    transform:none;
}

.register{

    display:block;

    margin-top:18px;

    padding:17px;

    border:1px solid rgba(255,255,255,.30);

    border-radius:17px;

    color:white;

    text-decoration:none;

    font-weight:bold;

    background:rgba(255,255,255,.06);
}

.register:hover{

    background:rgba(255,255,255,.12);
}

.info{

    margin-top:20px;

    padding:17px;

    border-radius:16px;

    background:rgba(255,255,255,.08);

    font-size:13px;

    line-height:1.6;
}

#apiStatus{

    margin-top:18px;

    font-size:13px;

    font-weight:bold;
}

#message{

    min-height:25px;

    margin-top:14px;

    font-size:14px;

    font-weight:bold;

    line-height:1.5;
}

.success{

    color:#7dffb2;
}

.error{

    color:#ffb5b5;
}

.loading{

    display:none;

    margin-top:10px;

    font-size:13px;
}

@media(max-width:600px){

    .login-card{

        padding:30px 20px;
    }

    h1{

        font-size:27px;
    }

    .logo{

        width:90px;
        height:90px;
    }
}

</style>

</head>


<body>


<div class="login-card">


    <!-- LOGO -->

    <img
        src="pic/1.jpg"
        class="logo"
        alt="B.Pharmacy"
    >


    <!-- TITLE -->

    <h1>
        🔐 Welcome Back
    </h1>


    <div class="subtitle">
        B.Pharmacy Attendance Management System
    </div>


    <!-- USER ID -->

    <label for="userId">
        👤 Admin ID / Enrollment Number
    </label>


    <input
        id="userId"
        type="text"
        placeholder="Enter Admin ID or Enrollment"
        autocomplete="username"
    >


    <!-- PASSWORD -->

    <label for="password">
        🔑 Password
    </label>


    <input
        id="password"
        type="password"
        placeholder="Enter Password"
        autocomplete="current-password"
    >


    <!-- LOGIN BUTTON -->

    <button
        id="loginBtn"
        type="button"
        onclick="login()"
    >
        🔓 Login
    </button>


    <!-- LOADING -->

    <div
        id="loading"
        class="loading"
    >
        ⏳ Checking account...
    </div>


    <!-- MESSAGE -->

    <div id="message"></div>


    <!-- API STATUS -->

    <div id="apiStatus">
        Checking API...
    </div>


    <!-- REGISTER -->

    <a
        href="register.html"
        class="register"
    >
        📝 Create New Student Account
    </a>


    <!-- INFORMATION -->

    <div class="info">

        <b>Students:</b>
        Register first and wait for admin approval.

        <br><br>

        <b>Administrator:</b>
        Use the Admin ID and Admin Password.

    </div>


</div>



<script>

/* =====================================================
   GOOGLE APPS SCRIPT API
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycby2wlNgfHgpJjKhYpEx6sEPJsy5NhN2MwdAEF3h6v1l3RsOONTkL42wdGonfXWv9DogEg/exec";


/* =====================================================
   ELEMENTS
   ===================================================== */

const userIdInput =
    document.getElementById("userId");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");

const loading =
    document.getElementById("loading");

const apiStatus =
    document.getElementById("apiStatus");


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(text,type){

    message.textContent = text;

    message.className = type || "";

}


/* =====================================================
   CHECK API
   ===================================================== */

async function checkAPI(){

    try{

        const response =
            await fetch(
                API_URL,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        const text =
            await response.text();


        console.log(
            "API STATUS:",
            text
        );


        let result = null;


        try{

            result =
                JSON.parse(text);

        }

        catch(error){

            result = null;

        }


        if(
            response.ok &&
            result &&
            result.success === true
        ){

            apiStatus.textContent =
                "🟢 B.Pharmacy Attendance API is working";

            apiStatus.style.color =
                "#7dffb2";

        }

        else if(response.ok){

            apiStatus.textContent =
                "🟢 API connected";

            apiStatus.style.color =
                "#7dffb2";

        }

        else{

            throw new Error(
                "API error"
            );

        }

    }

    catch(error){

        console.error(
            "API CHECK ERROR:",
            error
        );


        apiStatus.textContent =
            "🔴 API connection failed";

        apiStatus.style.color =
            "#ffb5b5";

    }

}


/* =====================================================
   LOGIN
   ===================================================== */

async function login(){

    const id =
        userIdInput.value.trim();

    const pass =
        passwordInput.value;


    /* -----------------------------------------------
       VALIDATION
       ----------------------------------------------- */

    if(!id){

        showMessage(
            "❌ Please enter Admin ID or Enrollment Number.",
            "error"
        );

        userIdInput.focus();

        return;

    }


    if(!pass){

        showMessage(
            "❌ Please enter password.",
            "error"
        );

        passwordInput.focus();

        return;

    }


    /* -----------------------------------------------
       CLEAR OLD SESSION
       ----------------------------------------------- */

    sessionStorage.clear();


    /* -----------------------------------------------
       LOADING
       ----------------------------------------------- */

    loginBtn.disabled = true;

    loginBtn.textContent =
        "⏳ Logging in...";

    loading.style.display =
        "block";

    showMessage(
        "",
        ""
    );


    try{


        /* =================================================
           ADMIN LOGIN
           
           Admin credentials:
           
           ID       = ADMIN
           Password = 811307
           
           The backend handles these credentials.
           ================================================= */

        if(
            id.toUpperCase() === "ADMIN"
        ){

            const adminUrl =
                API_URL +
                "?action=adminLogin" +
                "&id=" +
                encodeURIComponent(id) +
                "&password=" +
                encodeURIComponent(pass);


            console.log(
                "Sending ADMIN login request"
            );


            const response =
                await fetch(
                    adminUrl,
                    {
                        method:"GET",
                        cache:"no-store",
                        redirect:"follow"
                    }
                );


            const text =
                await response.text();


            console.log(
                "ADMIN RESPONSE:",
                text
            );


            let result;


            try{

                result =
                    JSON.parse(text);

            }

            catch(error){

                throw new Error(
                    "Invalid response from server: " +
                    text
                );

            }


            /* -----------------------------------------
               ADMIN SUCCESS
               ----------------------------------------- */

            if(
                result.success === true
            ){

                const token =
                    result.token ||
                    "";


                if(!token){

                    throw new Error(
                        "Admin login succeeded but no session token was returned."
                    );

                }


                sessionStorage.setItem(
                    "BP7_LOGGED_IN",
                    "true"
                );


                sessionStorage.setItem(
                    "BP7_SESSION",
                    token
                );


                sessionStorage.setItem(
                    "BP7_USER_ID",
                    "ADMIN"
                );


                sessionStorage.setItem(
                    "BP7_USER_NAME",
                    "Administrator"
                );


                sessionStorage.setItem(
                    "BP7_ROLE",
                    "admin"
                );


                sessionStorage.setItem(
                    "BP7_ENROLLMENT",
                    "ADMIN"
                );


                showMessage(
                    "✅ Admin login successful! Opening Admin Panel...",
                    "success"
                );


                setTimeout(
                    function(){

                        window.location.href =
                            "admin.html";

                    },
                    500
                );


                return;

            }


            /* -----------------------------------------
               ADMIN FAILED
               ----------------------------------------- */

            showMessage(
                "❌ " +
                (
                    result.message ||
                    "Invalid Admin ID or password."
                ),
                "error"
            );


            return;

        }


        /* =================================================
           STUDENT LOGIN
           ================================================= */

        const studentUrl =
            API_URL +
            "?action=login" +
            "&enrollment=" +
            encodeURIComponent(id) +
            "&password=" +
            encodeURIComponent(pass);


        console.log(
            "Sending STUDENT login request"
        );


        const response =
            await fetch(
                studentUrl,
                {
                    method:"GET",
                    cache:"no-store",
                    redirect:"follow"
                }
            );


        const text =
            await response.text();


        console.log(
            "STUDENT RESPONSE:",
            text
        );


        let result;


        try{

            result =
                JSON.parse(text);

        }

        catch(error){

            throw new Error(
                "Invalid response from server: " +
                text
            );

        }


        /* -----------------------------------------
           STUDENT SUCCESS
           ----------------------------------------- */

        if(
            result.success === true
        ){

            if(!result.token){

                throw new Error(
                    "Login succeeded but no session token was returned."
                );

            }


            sessionStorage.setItem(
                "BP7_LOGGED_IN",
                "true"
            );


            sessionStorage.setItem(
                "BP7_SESSION",
                result.token
            );


            sessionStorage.setItem(
                "BP7_USER_ID",
                result.user &&
                result.user.id
                    ? result.user.id
                    : id
            );


            sessionStorage.setItem(
                "BP7_USER_NAME",
                result.user &&
                result.user.name
                    ? result.user.name
                    : id
            );


            sessionStorage.setItem(
                "BP7_ENROLLMENT",
                result.user &&
                result.user.enrollment
                    ? result.user.enrollment
                    : id
            );


            sessionStorage.setItem(
                "BP7_ROLE",
                "student"
            );


            showMessage(
                "✅ Login successful! Opening Dashboard...",
                "success"
            );


            setTimeout(
                function(){

                    window.location.href =
                        "dashboard.html";

                },
                500
            );


            return;

        }


        /* -----------------------------------------
           STUDENT FAILED
           ----------------------------------------- */

        showMessage(
            "❌ " +
            (
                result.message ||
                "Account not found."
            ),
            "error"
        );

    }


    catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        showMessage(
            "❌ " +
            (
                error.message ||
                "Unable to connect to server."
            ),
            "error"
        );

    }


    finally{

        loginBtn.disabled =
            false;

        loginBtn.textContent =
            "🔓 Login";

        loading.style.display =
            "none";

    }

}


/* =====================================================
   ENTER KEY SUPPORT
   ===================================================== */

userIdInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            passwordInput.focus();

        }

    }
);


passwordInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            login();

        }

    }
);


/* =====================================================
   START API CHECK
   ===================================================== */

checkAPI();

</script>

</body>

</html>
