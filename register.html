<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>B.Pharmacy | Register</title>

<style>

/* =====================================================
   BASIC
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    font-family:
        system-ui,
        -apple-system,
        "Segoe UI",
        Arial,
        sans-serif;

    color:white;

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(155,135,255,.35),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 90%,
            rgba(255,117,168,.30),
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #17152f 0%,
            #493c78 50%,
            #8e5478 100%
        );

}


/* =====================================================
   CONTAINER
===================================================== */

.container{

    width:100%;

    max-width:470px;

}


/* =====================================================
   CARD
===================================================== */

.card{

    padding:28px 24px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.18),
            rgba(255,255,255,.07)
        );

    border:
        1px solid rgba(255,255,255,.25);

    backdrop-filter:blur(22px);

    -webkit-backdrop-filter:blur(22px);

    box-shadow:
        0 25px 70px rgba(0,0,0,.40);

    animation:cardIn .45s ease;

}


@keyframes cardIn{

    from{

        opacity:0;

        transform:
            translateY(20px)
            scale(.98);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =====================================================
   HEADER
===================================================== */

.header{

    text-align:center;

    margin-bottom:22px;

}

.logo{

    width:78px;

    height:78px;

    object-fit:cover;

    border-radius:20px;

    margin-bottom:12px;

    border:
        2px solid
        rgba(255,255,255,.35);

    box-shadow:
        0 12px 30px rgba(0,0,0,.30);

}

h1{

    font-size:23px;

    font-weight:800;

    margin-bottom:5px;

}

.subtitle{

    font-size:12px;

    opacity:.75;

    line-height:1.5;

}


/* =====================================================
   FORM
===================================================== */

.form-group{

    margin-bottom:14px;

}

label{

    display:block;

    font-size:12px;

    font-weight:700;

    margin-bottom:6px;

    opacity:.9;

}

.input-wrapper{

    position:relative;

}

.input-icon{

    position:absolute;

    left:13px;

    top:50%;

    transform:
        translateY(-50%);

    font-size:16px;

    opacity:.65;

}

input,
select{

    width:100%;

    padding:
        13px
        13px
        13px
        42px;

    border:none;

    outline:none;

    border-radius:12px;

    background:#fff;

    color:#111827;

    font-size:14px;

}

select{

    padding-left:42px;

    cursor:pointer;

}

input:focus,
select:focus{

    box-shadow:
        0 0 0 3px
        rgba(144,202,249,.35);

}


/* =====================================================
   PASSWORD INFO
===================================================== */

.password-info{

    font-size:10px;

    opacity:.65;

    margin-top:5px;

}


/* =====================================================
   BUTTONS
===================================================== */

button{

    width:100%;

    padding:13px;

    border:none;

    border-radius:13px;

    font-size:14px;

    font-weight:800;

    cursor:pointer;

    transition:.15s;

}

.register-btn{

    margin-top:5px;

    background:
        linear-gradient(
            135deg,
            #00a844,
            #008f3b
        );

    color:white;

    box-shadow:
        0 8px 20px
        rgba(0,168,68,.25);

}

.register-btn:hover{

    transform:
        translateY(-1px);

}

.register-btn:active{

    transform:
        scale(.98);

}

.register-btn:disabled{

    opacity:.6;

    cursor:not-allowed;

}

.back-btn{

    margin-top:10px;

    background:
        rgba(255,255,255,.10);

    color:white;

    border:
        1px solid
        rgba(255,255,255,.22);

}


/* =====================================================
   MESSAGE
===================================================== */

.message{

    min-height:20px;

    margin-top:12px;

    text-align:center;

    font-size:12px;

    font-weight:700;

    line-height:1.5;

}

.message.error{

    color:#ffb4b4;

}

.message.success{

    color:#8affbd;

}


/* =====================================================
   APPROVAL NOTICE
===================================================== */

.notice{

    margin-top:17px;

    padding:12px;

    border-radius:12px;

    background:
        rgba(255,193,7,.12);

    border:
        1px solid
        rgba(255,193,7,.25);

    font-size:11px;

    line-height:1.6;

    color:#ffe69a;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:8px;

}

.spinner{

    width:15px;

    height:15px;

    border:
        2px solid
        rgba(255,255,255,.4);

    border-top-color:white;

    border-radius:50%;

    animation:
        spin .7s linear infinite;

}

@keyframes spin{

    to{

        transform:rotate(360deg);

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:480px){

    body{

        padding:14px;

    }

    .card{

        padding:24px 18px;

        border-radius:24px;

    }

    h1{

        font-size:21px;

    }

    .logo{

        width:70px;

        height:70px;

    }

}

</style>

</head>


<body>


<div class="container">

<div class="card">


<!-- =================================================
     HEADER
================================================== -->

<div class="header">

    <img
        src="pic/1.jpg"
        alt="B.Pharmacy"
        class="logo"
        onerror="this.style.display='none'"
    >

    <h1>
        📝 Create Account
    </h1>

    <p class="subtitle">
        B.Pharmacy – 7th Semester<br>
        Attendance Management System
    </p>

</div>


<!-- =================================================
     REGISTRATION FORM
================================================== -->

<form
    id="registerForm"
    onsubmit="registerUser(event)"
>


<!-- NAME -->

<div class="form-group">

<label for="name">
    Full Name
</label>

<div class="input-wrapper">

<span class="input-icon">
    👤
</span>

<input
    id="name"
    type="text"
    placeholder="Enter your full name"
    autocomplete="name"
    required
>

</div>

</div>


<!-- ENROLLMENT -->

<div class="form-group">

<label for="enrollment">
    Enrollment Number
</label>

<div class="input-wrapper">

<span class="input-icon">
    🎓
</span>

<input
    id="enrollment"
    type="text"
    placeholder="Example: AJU/230001"
    autocomplete="off"
    required
>

</div>

</div>


<!-- GROUP -->

<div class="form-group">

<label for="group">
    Group
</label>

<div class="input-wrapper">

<span class="input-icon">
    👥
</span>

<select
    id="group"
    required
>

<option value="">
    Select your group
</option>

<option value="A">
    Group A
</option>

<option value="B">
    Group B
</option>

<option value="C">
    Group C
</option>

<option value="D">
    Group D
</option>

</select>

</div>

</div>


<!-- PASSWORD -->

<div class="form-group">

<label for="password">
    Password
</label>

<div class="input-wrapper">

<span class="input-icon">
    🔑
</span>

<input
    id="password"
    type="password"
    placeholder="Create password"
    autocomplete="new-password"
    minlength="4"
    required
>

</div>

<div class="password-info">
    Minimum 4 characters
</div>

</div>


<!-- CONFIRM PASSWORD -->

<div class="form-group">

<label for="confirmPassword">
    Confirm Password
</label>

<div class="input-wrapper">

<span class="input-icon">
    🔐
</span>

<input
    id="confirmPassword"
    type="password"
    placeholder="Re-enter password"
    autocomplete="new-password"
    minlength="4"
    required
>

</div>

</div>


<!-- REGISTER -->

<button
    type="submit"
    id="registerBtn"
    class="register-btn"
>

    📝 Submit Registration

</button>


</form>


<!-- MESSAGE -->

<div
    id="message"
    class="message"
></div>


<!-- APPROVAL NOTICE -->

<div class="notice">

    ⚠️ <b>Admin Approval Required</b><br>

    After registration, your account will remain
    <b>Pending</b>. An administrator must approve
    your account before you can log in.

</div>


<!-- BACK -->

<button
    class="back-btn"
    onclick="goToLogin()"
>

    ← Back to Login

</button>


</div>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT URL
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycby2wlNgfHgpJjKhYpEx6sEPJsy5NhN2MwdAEF3h6v1l3RsOONTkL42wdGonfXWv9DogEg/exec";


/* =====================================================
   REGISTER USER
===================================================== */

async function registerUser(event){

    event.preventDefault();


    /* ---------- GET VALUES ---------- */

    const name =
        document
        .getElementById("name")
        .value
        .trim();

    const enrollment =
        document
        .getElementById("enrollment")
        .value
        .trim()
        .toUpperCase();

    const group =
        document
        .getElementById("group")
        .value;

    const password =
        document
        .getElementById("password")
        .value;

    const confirmPassword =
        document
        .getElementById("confirmPassword")
        .value;


    /* ---------- VALIDATION ---------- */

    if(name.length < 2){

        showMessage(
            "Please enter your full name.",
            "error"
        );

        return;

    }


    if(enrollment.length < 5){

        showMessage(
            "Please enter a valid enrollment number.",
            "error"
        );

        return;

    }


    if(!group){

        showMessage(
            "Please select your group.",
            "error"
        );

        return;

    }


    if(password.length < 4){

        showMessage(
            "Password must contain at least 4 characters.",
            "error"
        );

        return;

    }


    if(password !== confirmPassword){

        showMessage(
            "Passwords do not match.",
            "error"
        );

        return;

    }


    /* ---------- BUTTON ---------- */

    const button =
        document.getElementById(
            "registerBtn"
        );

    button.disabled = true;

    button.innerHTML = `

        <span class="loading">

            <span class="spinner"></span>

            Submitting...

        </span>

    `;


    showMessage(
        "",
        ""
    );


    try{


        /* =============================================
           SEND REGISTRATION TO GOOGLE APPS SCRIPT
        ============================================= */

        const response =
            await fetch(

                API_URL,

                {

                    method:"POST",

                    headers:{

                        "Content-Type":
                        "text/plain;charset=utf-8"

                    },

                    body:JSON.stringify({

                        action:"register",

                        name:name,

                        enrollment:enrollment,

                        group:group,

                        password:password

                    })

                }

            );


        /* ---------- READ RESPONSE ---------- */

        const result =
            await response.json();


        console.log(
            "Registration response:",
            result
        );


        /* =============================================
           SUCCESS
        ============================================= */

        if(result.success === true){

            showMessage(

                "✅ Registration successful! Your account is waiting for admin approval.",

                "success"

            );


            /*
             Clear form
            */

            document
            .getElementById(
                "registerForm"
            )
            .reset();


            /*
             Give user time to
             read success message.
            */

            setTimeout(

                function(){

                    window.location.href =
                        "index.html";

                },

                2500

            );

        }


        /* =============================================
           ERROR
        ============================================= */

        else{

            showMessage(

                result.message ||
                "Registration failed. Please try again.",

                "error"

            );

            resetButton();

        }

    }


    /* =============================================
       NETWORK ERROR
    ============================================= */

    catch(error){

        console.error(
            "Registration error:",
            error
        );


        showMessage(

            "❌ Unable to connect to the server. Please check your internet connection.",

            "error"

        );


        resetButton();

    }

}


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        "message " +
        (type || "");

}


/* =====================================================
   RESET BUTTON
===================================================== */

function resetButton(){

    const button =
        document.getElementById(
            "registerBtn"
        );


    button.disabled = false;

    button.innerHTML =
        "📝 Submit Registration";

}


/* =====================================================
   BACK TO LOGIN
===================================================== */

function goToLogin(){

    window.location.href =
        "index.html";

}


/* =====================================================
   PREVENT OLD LOGIN SESSION
===================================================== */

(function(){

    /*
       Registration page can be opened even
       when the user is logged in, but we don't
       automatically redirect here.
    */

})();

</script>

</body>

</html>
