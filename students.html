<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>B.Pharmacy | Students</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --primary:#5b4bb7;
    --secondary:#9b6fd1;
    --green:#00b894;
    --red:#e74c3c;
    --blue:#3498db;
    --orange:#f39c12;
}

body{
    min-height:100vh;
    padding:14px;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    color:white;

    background:
        radial-gradient(circle at 10% 10%,#ffffff25,transparent 28%),
        radial-gradient(circle at 90% 90%,#ffffff18,transparent 30%),
        linear-gradient(135deg,#211b42,#5b4bb7,#9b6fd1);
}

.container{
    max-width:1100px;
    margin:auto;
}

.topbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
}

.back{
    width:43px;
    height:43px;
    border:1px solid #ffffff35;
    border-radius:13px;
    background:#ffffff18;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.title{
    flex:1;
    text-align:center;
}

.title h1{
    font-size:20px;
}

.title p{
    font-size:11px;
    opacity:.7;
}

.logout{
    padding:9px 12px;
    border:0;
    border-radius:10px;
    background:#e74c3c;
    color:white;
    font-weight:700;
    cursor:pointer;
}

.card{
    background:#ffffff18;
    border:1px solid #ffffff30;
    backdrop-filter:blur(18px);
    border-radius:20px;
    padding:16px;
    margin-bottom:12px;
    box-shadow:0 18px 45px #0004;
}

.userbar{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
}

.userbar strong{
    font-size:14px;
}

.spacer{
    flex:1;
}

.search{
    width:100%;
    padding:13px;
    border:0;
    border-radius:12px;
    background:white;
    color:#111827;
    outline:none;
    font-size:14px;
}

.filter-row{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.filter-row select{
    flex:1;
    padding:11px;
    border:0;
    border-radius:10px;
    background:white;
    color:#111827;
}

.refresh{
    padding:11px 15px;
    border:0;
    border-radius:10px;
    background:#1976d2;
    color:white;
    font-weight:750;
    cursor:pointer;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.stat{
    padding:13px 7px;
    text-align:center;
    border-radius:13px;
    background:#ffffff15;
    border:1px solid #ffffff25;
}

.stat b{
    display:block;
    font-size:21px;
}

.stat small{
    font-size:10px;
    opacity:.7;
}

.safe{
    color:#69f0ae;
}

.danger{
    color:#ff8a80;
}

.warn{
    color:#ffd54f;
}

.student-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.student-card{
    background:white;
    color:#111827;
    border-radius:16px;
    padding:15px;
    box-shadow:0 10px 25px #0002;
}

.student-head{
    display:flex;
    align-items:center;
    gap:11px;
}

.avatar{
    width:46px;
    height:46px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#5b4bb7,#9b6fd1);
    color:white;
    font-weight:800;
    font-size:18px;
}

.student-info{
    flex:1;
    min-width:0;
}

.student-info h2{
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.enrollment{
    font-size:11px;
    color:#666;
    margin-top:3px;
}

.group{
    display:inline-block;
    margin-top:7px;
    padding:4px 7px;
    border-radius:7px;
    background:#eef0ff;
    color:#5b4bb7;
    font-size:9px;
    font-weight:800;
}

.attendance-box{
    margin-top:13px;
    padding-top:12px;
    border-top:1px solid #eee;
}

.attendance-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
}

.mini{
    text-align:center;
    padding:8px 4px;
    border-radius:9px;
    background:#f3f6ff;
}

.mini b{
    display:block;
    font-size:16px;
}

.mini small{
    font-size:9px;
    color:#666;
}

.progress{
    height:8px;
    background:#e5e5e5;
    border-radius:20px;
    overflow:hidden;
    margin-top:10px;
}

.progress i{
    display:block;
    height:100%;
    background:#2575fc;
    border-radius:20px;
}

.no-data{
    padding:30px;
    text-align:center;
    font-size:13px;
    opacity:.75;
}

.loading{
    text-align:center;
    padding:30px;
}

.message{
    text-align:center;
    font-size:12px;
    font-weight:700;
    min-height:20px;
    margin-top:10px;
}

@media(max-width:700px){

    .student-grid{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:450px){

    .filter-row{
        flex-direction:column;
    }

    .title h1{
        font-size:17px;
    }

    .logout{
        font-size:10px;
        padding:8px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- TOP BAR -->

    <div class="topbar">

        <button
            class="back"
            onclick="goDashboard()">
            ←
        </button>

        <div class="title">

            <h1>👨‍🎓 Students</h1>

            <p>
                B.Pharmacy • 7th Semester
            </p>

        </div>

        <button
            class="logout"
            onclick="logout()">
            Logout
        </button>

    </div>


    <!-- USER -->

    <div class="card">

        <div class="userbar">

            <span>👤 Logged in as</span>

            <strong id="userName">
                —
            </strong>

            <span class="spacer"></span>

            <span id="userRole">
                Student
            </span>

        </div>

    </div>


    <!-- SEARCH -->

    <div class="card">

        <input
            id="search"
            class="search"
            type="text"
            placeholder="🔍 Search by name or enrollment number..."
            oninput="renderStudents()">


        <div class="filter-row">

            <select
                id="groupFilter"
                onchange="renderStudents()">

                <option value="">
                    All Groups
                </option>

                <option value="A">
                    Group A
                </option>

                <option value="B">
                    Group B
                </option>

                <option value="C">
                    Group C
                </option>

                <option value="D">
                    Group D
                </option>

            </select>


            <button
                class="refresh"
                onclick="loadStudents()">
                🔄 Refresh
            </button>

        </div>


        <div
            id="message"
            class="message">
        </div>

    </div>


    <!-- STATISTICS -->

    <div class="card">

        <div class="stats">

            <div class="stat">

                <b
                    id="totalStudents"
                    class="safe">
                    0
                </b>

                <small>
                    Students
                </small>

            </div>


            <div class="stat">

                <b id="totalClasses">
                    0
                </b>

                <small>
                    Classes
                </small>

            </div>


            <div class="stat">

                <b
                    id="totalPresent"
                    class="safe">
                    0
                </b>

                <small>
                    Present Marks
                </small>

            </div>


            <div class="stat">

                <b
                    id="overallPercentage"
                    class="warn">
                    0%
                </b>

                <small>
                    Overall %
                </small>

            </div>

        </div>

    </div>


    <!-- STUDENT LIST -->

    <div class="card">

        <div
            id="studentGrid"
            class="student-grid">

            <div class="loading">
                Loading students...
            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycby2wlNgfHgpJjKhYpEx6sEPJsy5NhN2MwdAEF3h6v1l3RsOONTkL42wdGonfXWv9DogEg/exec";


/* =====================================================
   LOGIN PROTECTION
   ===================================================== */

const loggedIn =
sessionStorage.getItem("BP7_LOGGED_IN");

const session =
sessionStorage.getItem("BP7_SESSION");

const userId =
sessionStorage.getItem("BP7_USER_ID");

const userName =
sessionStorage.getItem("BP7_USER_NAME");

const userRole =
sessionStorage.getItem("BP7_ROLE");


if(
    loggedIn !== "true" ||
    !session
){

    window.location.replace(
        "index.html"
    );

}


/* =====================================================
   USER DISPLAY
   ===================================================== */

document.getElementById(
    "userName"
).textContent =
userName || userId || "User";


document.getElementById(
    "userRole"
).textContent =
String(userRole).toLowerCase() === "admin"
    ? "🔐 Administrator"
    : "🎓 Student";


/* =====================================================
   DATA
   ===================================================== */

let students = [];


/*
 * Expected student object:
 *
 * {
 *   id:"M001",
 *   name:"Rahul Kumar",
 *   enrollment:"AJU/230001",
 *   group:"A",
 *   present:18,
 *   absent:5,
 *   total:23,
 *   percentage:78.26
 * }
 */


/* =====================================================
   LOAD STUDENTS
   ===================================================== */

async function loadStudents(){

    const grid =
        document.getElementById(
            "studentGrid"
        );


    grid.innerHTML = `
        <div class="loading">
            ⏳ Loading students...
        </div>
    `;


    try{

        const url =
            API_URL +

            "?action=students" +

            "&session=" +
            encodeURIComponent(session);


        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Server error"
            );

        }


        const result =
            await response.json();


        console.log(
            "Student API:",
            result
        );


        if(
            result.success !== true
        ){

            throw new Error(
                result.message ||
                "Unable to load students"
            );

        }


        students =
            result.students ||
            result.data ||
            [];


        /*
         * Make field names compatible
         * with different Sheet headers.
         */

        students =
            students.map(
                student => ({

                    id:
                        student.id ||
                        student.ID ||
                        "",

                    name:
                        student.name ||
                        student.Name ||
                        "",

                    enrollment:
                        student.enrollment ||
                        student.Enrollment ||
                        student.enrollmentNo ||
                        "",

                    group:
                        student.group ||
                        student.Group ||
                        "",

                    present:
                        Number(
                            student.present ||
                            student.Present ||
                            0
                        ),

                    absent:
                        Number(
                            student.absent ||
                            student.Absent ||
                            0
                        ),

                    total:
                        Number(
                            student.total ||
                            student.Total ||
                            0
                        ),

                    percentage:
                        Number(
                            student.percentage ||
                            student.Percentage ||
                            0
                        )

                })
            );


        renderStudents();

        updateOverallStats();


        showMessage(
            "✅ Student list updated.",
            "success"
        );

    }

    catch(error){

        console.error(error);

        grid.innerHTML = `
            <div class="no-data">
                ❌ Unable to load student data.
                <br><br>
                Check your Google Apps Script.
            </div>
        `;


        showMessage(
            "❌ " +
            (
                error.message ||
                "Unable to load students."
            ),
            "error"
        );

    }

}


/* =====================================================
   RENDER STUDENTS
   ===================================================== */

function renderStudents(){

    const grid =
        document.getElementById(
            "studentGrid"
        );


    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    const group =
        document.getElementById(
            "groupFilter"
        ).value;


    const filtered =
        students.filter(
            student => {

                const name =
                    String(
                        student.name || ""
                    ).toLowerCase();


                const enrollment =
                    String(
                        student.enrollment || ""
                    ).toLowerCase();


                const matchesSearch =
                    !search ||
                    name.includes(search) ||
                    enrollment.includes(search);


                const matchesGroup =
                    !group ||
                    String(
                        student.group
                    ).toUpperCase() ===
                    group;


                return (
                    matchesSearch &&
                    matchesGroup
                );

            }
        );


    if(!filtered.length){

        grid.innerHTML = `
            <div class="no-data">
                🔍 No students found.
            </div>
        `;

        return;

    }


    grid.innerHTML =
        filtered
        .map(
            (student,index) => {

                const present =
                    Number(
                        student.present || 0
                    );


                const absent =
                    Number(
                        student.absent || 0
                    );


                let total =
                    Number(
                        student.total || 0
                    );


                /*
                 * If total is not supplied,
                 * calculate it.
                 */

                if(
                    total === 0 &&
                    (present + absent) > 0
                ){

                    total =
                        present + absent;

                }


                let percentage =
                    Number(
                        student.percentage || 0
                    );


                if(
                    !percentage &&
                    total > 0
                ){

                    percentage =
                        present /
                        total *
                        100;

                }


                percentage =
                    Math.max(
                        0,
                        Math.min(
                            100,
                            percentage
                        )
                    );


                const name =
                    student.name ||
                    "Unknown Student";


                const enrollment =
                    student.enrollment ||
                    "No enrollment";


                const group =
                    student.group
                    ? "Group " +
                      student.group
                    : "Student";


                const initial =
                    name
                    .trim()
                    .charAt(0)
                    .toUpperCase();


                let percentageClass =
                    "safe";


                if(
                    percentage < 75
                ){

                    percentageClass =
                        "danger";

                }
                else if(
                    percentage < 80
                ){

                    percentageClass =
                        "warn";

                }


                return `

                <div
                    class="student-card">

                    <div
                        class="student-head">

                        <div
                            class="avatar">

                            ${escapeHTML(initial)}

                        </div>


                        <div
                            class="student-info">

                            <h2>
                                ${escapeHTML(name)}
                            </h2>

                            <div
                                class="enrollment">

                                ${escapeHTML(
                                    enrollment
                                )}

                            </div>

                            <span
                                class="group">

                                ${escapeHTML(
                                    group
                                )}

                            </span>

                        </div>

                    </div>


                    <div
                        class="attendance-box">

                        <div
                            class="attendance-grid">

                            <div class="mini">

                                <b
                                    class="safe">

                                    ${present}

                                </b>

                                <small>
                                    Present
                                </small>

                            </div>


                            <div class="mini">

                                <b
                                    class="danger">

                                    ${absent}

                                </b>

                                <small>
                                    Absent
                                </small>

                            </div>


                            <div class="mini">

                                <b
                                    class="${percentageClass}">

                                    ${percentage.toFixed(1)}%

                                </b>

                                <small>
                                    Attendance
                                </small>

                            </div>

                        </div>


                        <div
                            class="progress">

                            <i
                                style="
                                    width:${percentage}%
                                ">
                            </i>

                        </div>

                    </div>

                </div>

                `;

            }
        )
        .join("");

}


/* =====================================================
   OVERALL STATISTICS
   ===================================================== */

function updateOverallStats(){

    const totalStudents =
        students.length;


    let classes = 0;

    let present = 0;

    let totalMarks = 0;


    students.forEach(
        student => {

            const p =
                Number(
                    student.present || 0
                );


            const a =
                Number(
                    student.absent || 0
                );


            present += p;

            totalMarks +=
                Number(
                    student.total ||
                    (p + a) ||
                    0
                );

        }
    );


    /*
     * Estimate classes from
     * attendance records.
     */

    if(totalStudents){

        classes =
            Math.round(
                totalMarks /
                totalStudents
            );

    }


    const percentage =
        totalMarks
        ? present /
          totalMarks *
          100
        : 0;


    document.getElementById(
        "totalStudents"
    ).textContent =
        totalStudents;


    document.getElementById(
        "totalClasses"
    ).textContent =
        classes;


    document.getElementById(
        "totalPresent"
    ).textContent =
        present;


    document.getElementById(
        "overallPercentage"
    ).textContent =
        percentage.toFixed(1) +
        "%";

}


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(
    text,
    type
){

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.style.color =
        type === "error"
        ? "#ffb3b3"
        : "#69f0ae";

}


/* =====================================================
   DASHBOARD
   ===================================================== */

function goDashboard(){

    window.location.href =
        "dashboard.html";

}


/* =====================================================
   LOGOUT
   ===================================================== */

function logout(){

    sessionStorage.clear();

    window.location.replace(
        "index.html"
    );

}


/* =====================================================
   SECURITY / HTML ESCAPE
   ===================================================== */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================================
   START
   ===================================================== */

loadStudents();

</script>

</body>
</html>
